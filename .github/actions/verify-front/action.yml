name: "Verify the served web build"
description: "Checks that Firebase Hosting answers on the site address with the expected headers, then that the public domain serves the entry point of the build that was just released. Shared by the deployment and the rollback."
inputs:
  dist:
    description: "Folder of the build that was just released, to compare its index.html with the one the domain serves; empty to only check that the public domain answers"
    required: false
    default: ""
  hosting-url:
    description: "Address of the Hosting site (https://<site>.web.app), probed before the public domain"
    required: true
  public-origins:
    description: "Public web origins, comma-separated as in ALLOWED_ORIGINS; the first one is probed, empty to skip"
    required: false
    default: ""
  noindex:
    description: "true when the site must answer with X-Robots-Tag noindex (the staging), false when it must not (production): a header published on the wrong site fails here"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # -o file rather than /dev/null: with --retry, curl cannot rewind /dev/null and exits with 23
    # without ever writing the HTTP code. The headers are the ones `infra/firebase-hosting.json`
    # declares: a version released without its config would answer 200 all the same.
    - name: Web smoke test (Hosting site)
      shell: bash
      env:
        HOSTING_URL: ${{ inputs.hosting-url }}
        NOINDEX: ${{ inputs.noindex }}
      run: |
        set -eo pipefail
        code="$(curl -sS -o "$RUNNER_TEMP/hosting.html" -D "$RUNNER_TEMP/hosting.headers" -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "$HOSTING_URL/")"
        echo "GET $HOSTING_URL/ -> $code"
        test "$code" = "200"
        grep -qi '^x-frame-options: DENY' "$RUNNER_TEMP/hosting.headers"
        grep -qi '^cache-control: no-cache, must-revalidate' "$RUNNER_TEMP/hosting.headers"
        if [ "$NOINDEX" = "true" ]; then
          grep -qi '^x-robots-tag: .*noindex' "$RUNNER_TEMP/hosting.headers" || {
            echo "::error::$HOSTING_URL answers without X-Robots-Tag noindex: this site must never be indexed."
            exit 1
          }
        elif grep -qi '^x-robots-tag: .*noindex' "$RUNNER_TEMP/hosting.headers"; then
          echo "::error::$HOSTING_URL answers with X-Robots-Tag noindex: a staging header reached this site, it would leave the index."
          exit 1
        fi
        echo "Hosting answers with the expected headers."
    # The previous smoke test queries the site address: it says nothing about the public domain
    # served to users, whose DNS or certificate can be broken while the site answers perfectly.
    # A 200 does not say which version is served either: the hashed entry point of the build that
    # was just released is compared with the one the public domain really serves.
    - name: Web smoke test (public domain + served version)
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
        ALLOWED_ORIGINS: ${{ inputs.public-origins }}
      run: |
        set -eo pipefail
        PUBLIC_WEB_URL="${ALLOWED_ORIGINS%%,*}"
        if [ -z "$PUBLIC_WEB_URL" ]; then
          echo "::warning::Public origin missing, public web domain not verified."
          exit 0
        fi
        echo "Public domain: $PUBLIC_WEB_URL"
        code="$(curl -sS -o "$RUNNER_TEMP/pub.html" -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "$PUBLIC_WEB_URL/")"
        echo "GET $PUBLIC_WEB_URL/ -> $code"
        if [ "$code" != "200" ]; then
          echo "::error::$PUBLIC_WEB_URL does not answer 200: DNS, certificate or custom domain of the web hosting."
          exit 1
        fi
        if [ -z "$DIST" ]; then
          echo "No local build to compare with: the public domain answers, version not checked."
          exit 0
        fi
        ENTRY="$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' "$DIST/index.html" | head -1 || true)"
        if [ -z "$ENTRY" ]; then
          echo "::error::Entry point not found in the local build, version smoke test impossible."
          exit 1
        fi
        echo "Expected entry point: $ENTRY"
        if ! grep -qF "$ENTRY" "$RUNNER_TEMP/pub.html"; then
          echo "::error::$PUBLIC_WEB_URL serves an index.html that does not reference $ENTRY: the release did not reach the public domain."
          exit 1
        fi
