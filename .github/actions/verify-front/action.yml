name: "Invalidate CloudFront and verify the served web build"
description: "Invalidates the distribution, checks that CloudFront answers, then that the public domain serves the entry point of the build that was just published. Shared by the deployment and the rollback."
inputs:
  dist:
    description: "Folder of the build that was just published, to compare its index.html with the one the domain serves"
    required: true
  distribution-id:
    description: "CloudFront distribution id (AWS_CLOUDFRONT_DISTRIBUTION_ID variable); empty to skip the invalidation"
    required: false
    default: ""
  public-origins:
    description: "Public web origins, comma-separated as in ALLOWED_ORIGINS; the first one is probed, empty to skip"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: CloudFront invalidation
      if: inputs.distribution-id != ''
      shell: bash
      env:
        DISTRIBUTION_ID: ${{ inputs.distribution-id }}
      run: |
        set -eo pipefail
        INV_ID=$(aws cloudfront create-invalidation \
          --distribution-id "$DISTRIBUTION_ID" \
          --paths "/*" \
          --query 'Invalidation.Id' --output text)
        aws cloudfront wait invalidation-completed \
          --distribution-id "$DISTRIBUTION_ID" \
          --id "$INV_ID"
    - name: Web smoke test (CloudFront)
      if: inputs.distribution-id != ''
      shell: bash
      env:
        DISTRIBUTION_ID: ${{ inputs.distribution-id }}
      run: |
        set -eo pipefail
        DOMAIN="$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query 'Distribution.DomainName' --output text)"
        echo "CloudFront domain : $DOMAIN"
        # -o fichier plutôt que /dev/null : avec --retry, curl ne peut pas rembobiner /dev/null
        # et sort en 23 sans jamais écrire le code HTTP.
        code="$(curl -sS -o "$RUNNER_TEMP/cf.html" -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "https://$DOMAIN/")"
        echo "GET / -> $code"
        test "$code" = "200"
    # Le smoke test précédent interroge le domaine CloudFront : il ne dit rien du domaine public
    # servi aux utilisateurs, dont le DNS, le certificat ou l'alias peuvent être cassés alors que
    # la distribution répond très bien.
    # Un 200 ne dit pas quelle version est servie : sans invalidation, le CDN répond 200 avec
    # l'ancien index.html et la publication passe pour bonne. On compare donc le point d'entrée
    # haché du build qu'on vient d'envoyer à celui que le domaine public sert vraiment.
    - name: Web smoke test (public domain + served version)
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
        ALLOWED_ORIGINS: ${{ inputs.public-origins }}
      run: |
        set -eo pipefail
        PUBLIC_WEB_URL="${ALLOWED_ORIGINS%%,*}"
        if [ -z "$PUBLIC_WEB_URL" ]; then
          echo "::warning::Origine publique absente, domaine public du front non vérifié."
          exit 0
        fi
        echo "Domaine public : $PUBLIC_WEB_URL"
        code="$(curl -sS -o "$RUNNER_TEMP/pub.html" -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 "$PUBLIC_WEB_URL/")"
        echo "GET $PUBLIC_WEB_URL/ -> $code"
        if [ "$code" != "200" ]; then
          echo "::error::$PUBLIC_WEB_URL ne répond pas 200 : DNS, certificat ou alias de l'hébergement du front."
          exit 1
        fi
        ENTRY="$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' "$DIST/index.html" | head -1)"
        if [ -z "$ENTRY" ]; then
          echo "::error::Point d'entrée introuvable dans le build local, smoke test de version impossible."
          exit 1
        fi
        echo "Point d'entrée attendu : $ENTRY"
        if ! grep -qF "$ENTRY" "$RUNNER_TEMP/pub.html"; then
          echo "::error::$PUBLIC_WEB_URL sert un index.html qui ne référence pas $ENTRY, build périmé en cache (invalidation CDN absente ou incomplète)."
          exit 1
        fi
