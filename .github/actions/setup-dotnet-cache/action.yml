name: "Setup .NET (NuGet cache)"
description: "Installs the .NET SDK and restores the NuGet cache (~/.nuget/packages)."
inputs:
  dotnet-version:
    description: ".NET SDK version"
    required: false
    default: "10.0.x"
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('apps/api-dotnet/**/*.csproj', 'apps/api-dotnet/Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-
