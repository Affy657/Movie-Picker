name: "Setup .NET (cache NuGet)"
description: "Installe le SDK .NET et restaure le cache NuGet (~/.nuget/packages)."
inputs:
  dotnet-version:
    description: "Version du SDK .NET"
    required: false
    default: "10.0.x"
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('apps/api-dotnet/**/*.csproj', 'apps/api-dotnet/Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-
