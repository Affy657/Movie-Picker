name: "API health probes"
description: "Probes /health then /health/ready on a Cloud Run revision or service URL, and /health on the public domain when given. Shared by the deployment (before and after promotion) and the rollback."
inputs:
  url:
    description: "Base URL of the API to probe (tagged revision or Cloud Run service)"
    required: true
  public-url:
    description: "Public URL of the API, the one the web app calls; empty to skip it"
    required: false
    default: ""
  public-url-expected:
    description: "true when probing live production: an empty public URL then raises a warning instead of staying silent"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    #   --max-time : sans lui, une révision qui accepte la connexion sans jamais répondre épuise
    #   le timeout du job, et un job *annulé* n'exécute aucune étape de rattrapage.
    #   -o fichier plutôt que /dev/null : avec --retry, curl ne peut pas rembobiner /dev/null et
    #   sort en 23 sans écrire le code HTTP, ce qui rendait les diagnostics suivants inatteignables.
    - name: /health then /health/ready
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        set -eo pipefail
        BODY="$RUNNER_TEMP/health.json"
        curl -sS --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 -o "$BODY" "$URL/health"
        echo "Réponse /health : $(cat "$BODY")"
        grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' "$BODY" || {
          echo "::error::/health ne renvoie pas status=ok"
          exit 1
        }
        curl -sS --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 -o "$BODY" "$URL/health/ready"
        echo "Réponse /health/ready : $(cat "$BODY")"
        grep -qE '"status"[[:space:]]*:[[:space:]]*"ready"' "$BODY" || {
          echo "::error::/health/ready ne renvoie pas status=ready (dépendance indisponible)"
          exit 1
        }
        grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' "$BODY" || {
          echo "::error::/health/ready signale MongoDB comme non joignable"
          exit 1
        }
    # Un échec ici relève du routage, du DNS ou du certificat, pas du code.
    - name: Public domain
      if: inputs.public-url != ''
      shell: bash
      env:
        PUBLIC_URL: ${{ inputs.public-url }}
      run: |
        set -eo pipefail
        BODY="$RUNNER_TEMP/public-health.json"
        curl -sS --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 -o "$BODY" "$PUBLIC_URL/health"
        echo "Domaine public : $(cat "$BODY")"
        grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' "$BODY" || {
          echo "::error::Le domaine public de l'API ne renvoie pas status=ok : DNS, certificat ou mapping de domaine."
          exit 1
        }
    - name: Public domain not provided
      if: inputs.public-url == '' && inputs.public-url-expected == 'true'
      shell: bash
      run: echo "::warning::URL publique de l'API absente, domaine public non vérifié."
