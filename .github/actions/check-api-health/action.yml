name: "API health probes"
description: "Probes /health then /health/ready on a Cloud Run revision or service URL, and /health on the public domain when given. Shared by the deployment (before and after promotion) and the rollback."
inputs:
  url:
    description: "Base URL of the API to probe (tagged revision or Cloud Run service)"
    required: true
  public-url:
    description: "Public URL of the API, the one the web app calls; empty to skip it"
    required: false
    default: ""
  public-url-expected:
    description: "true when probing live production: an empty public URL then raises a warning instead of staying silent"
    required: false
    default: "false"
  expected-release:
    description: "Release the probed API must report in /health/ready (the SHA the revision was built from); empty to skip the check"
    required: false
    default: ""
runs:
  using: composite
  steps:
    #   --max-time: without it, a revision that accepts the connection but never answers exhausts
    #   the job timeout, and a *cancelled* job runs no recovery step.
    #   -o file rather than /dev/null: with --retry, curl cannot rewind /dev/null and exits with 23
    #   without writing the HTTP code, which made the following diagnostics unreachable.
    - name: /health then /health/ready
      shell: bash
      env:
        URL: ${{ inputs.url }}
        EXPECTED_RELEASE: ${{ inputs.expected-release }}
      run: |
        set -eo pipefail
        BODY="$RUNNER_TEMP/health.json"
        curl -sS --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 -o "$BODY" "$URL/health"
        echo "/health response: $(cat "$BODY")"
        grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' "$BODY" || {
          echo "::error::/health does not return status=ok"
          exit 1
        }
        curl -sS --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 -o "$BODY" "$URL/health/ready"
        echo "/health/ready response: $(cat "$BODY")"
        grep -qE '"status"[[:space:]]*:[[:space:]]*"ready"' "$BODY" || {
          echo "::error::/health/ready does not return status=ready (dependency unavailable)"
          exit 1
        }
        grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' "$BODY" || {
          echo "::error::/health/ready reports MongoDB as unreachable"
          exit 1
        }
        if [ -n "$EXPECTED_RELEASE" ]; then
          SERVED="$(jq -r '.release // ""' "$BODY")"
          if [ "$SERVED" != "$EXPECTED_RELEASE" ]; then
            echo "::error::$URL serves release '${SERVED:-none}', expected '$EXPECTED_RELEASE': the traffic did not move to this revision."
            exit 1
          fi
          echo "Served release matches: $SERVED"
        fi
    # A failure here is routing, DNS or certificate, not code.
    - name: Public domain
      if: inputs.public-url != ''
      shell: bash
      env:
        PUBLIC_URL: ${{ inputs.public-url }}
        EXPECTED_RELEASE: ${{ inputs.expected-release }}
      run: |
        set -eo pipefail
        BODY="$RUNNER_TEMP/public-health.json"
        curl -sS --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 -o "$BODY" "$PUBLIC_URL/health"
        echo "Public domain: $(cat "$BODY")"
        grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' "$BODY" || {
          echo "::error::The public API domain does not return status=ok: DNS, certificate or domain mapping."
          exit 1
        }
        if [ -n "$EXPECTED_RELEASE" ]; then
          curl -sS --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 -o "$BODY" "$PUBLIC_URL/health/ready"
          SERVED="$(jq -r '.release // ""' "$BODY")"
          if [ "$SERVED" != "$EXPECTED_RELEASE" ]; then
            echo "::error::$PUBLIC_URL serves release '${SERVED:-none}', expected '$EXPECTED_RELEASE': the public domain does not lead to the promoted revision."
            exit 1
          fi
          echo "Public domain serves release $SERVED"
        fi
    - name: Public domain not provided
      if: inputs.public-url == '' && inputs.public-url-expected == 'true'
      shell: bash
      run: echo "::warning::Public API URL missing, public domain not verified."
