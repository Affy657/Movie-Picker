name: "Terraform init, plan and apply"
description: "Installs the pinned Terraform, initialises one root module of infra/terraform/environments/ on its remote state and plans it. The plan text is left in $RUNNER_TEMP/plan.txt, its public form (refresh lines dropped, project id, project number and state bucket replaced by placeholders) in $RUNNER_TEMP/plan.public.txt, and two outputs tell the caller what it holds: the exit code of -detailed-exitcode, and the number of resources the plan would create, change or destroy, which an output-only refresh leaves at zero. With summary, the public form goes to the job summary; with apply, the saved plan is applied when it holds changes. Shared by the pull request plan, the master plan, the master apply and the weekly drift check of infra.yml."
inputs:
  root:
    description: "Root module to plan, relative to the repository (infra/terraform/environments/<name>)"
    required: true
  terraform-version:
    description: "Terraform version, the one pinned in every root module (pnpm run check:tools)"
    required: true
  state-bucket:
    description: "Bucket of the remote states (TF_STATE_BUCKET secret)"
    required: true
  project-id:
    description: "GCP project the root describes (GCP_PROJECT_ID secret)"
    required: true
  alert-email:
    description: "Address the alert policies notify (ALERT_EMAIL secret); read by the production root only, the others ignore it"
    required: false
    default: ""
  alert-sms-number:
    description: "Phone number the alert policies also notify by SMS (ALERT_SMS_NUMBER secret, optional); read by the production root only, empty means no SMS channel"
    required: false
    default: ""
  lock:
    description: "false to plan without taking the state lock, what a read-only review does"
    required: false
    default: "true"
  summary:
    description: "true to write the public form of the plan to the job summary, where the runner masks the secrets and this action the project number; false for a plan the caller posts itself"
    required: false
    default: "false"
  apply:
    description: "true to apply the saved plan (plan.tfplan, in the root module, an extension .gitignore already lists) when its exit code is 2; false for a plan that is only read"
    required: false
    default: "false"
outputs:
  exitcode:
    description: "Exit code of terraform plan -detailed-exitcode: 0 nothing to change, 2 changes (resources or outputs), 1 error"
    value: ${{ steps.plan.outputs.exitcode }}
  resource-changes:
    description: "Number of resources the plan creates, updates, replaces or destroys; 0 for a plan that only refreshes output values, which needs no approval and applies nothing"
    value: ${{ steps.plan.outputs.resource_changes }}
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.terraform.d/plugin-cache
        key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
    # The plugin cache directory is exported in each step rather than through GITHUB_ENV, which a
    # composite action is not meant to write.
    - name: terraform init (remote state, providers from the lock file)
      shell: bash
      env:
        TERRAFORM_ROOT: ${{ inputs.root }}
        TF_STATE_BUCKET: ${{ inputs.state-bucket }}
      run: |
        export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
        mkdir -p "$TF_PLUGIN_CACHE_DIR"
        terraform -chdir="$TERRAFORM_ROOT" init -input=false -lockfile=readonly -no-color -backend-config="bucket=$TF_STATE_BUCKET"
    # `-detailed-exitcode`: 0 nothing to change, 2 changes, 1 error. The plan text is kept whatever
    # the outcome, an error is worth reading too. The composite shell is `bash -eo pipefail`: the
    # code is caught on the pipeline, which `-e` would otherwise end on a 2, and `tee` does not
    # hide it (without pipefail an apply was once silently skipped behind a green job).
    # The plan is always saved: its JSON form is what counts the resources it touches, since a 2
    # also comes from a plan that only refreshes output values (a domain whose state Hosting
    # reports differently, for instance), which is nothing to approve or to apply.
    - name: terraform plan
      id: plan
      shell: bash
      env:
        TERRAFORM_ROOT: ${{ inputs.root }}
        TF_VAR_project_id: ${{ inputs.project-id }}
        TF_VAR_state_bucket: ${{ inputs.state-bucket }}
        ALERT_EMAIL: ${{ inputs.alert-email }}
        ALERT_SMS_NUMBER: ${{ inputs.alert-sms-number }}
        LOCK: ${{ inputs.lock }}
      run: |
        # Exported only when given: an empty TF_VAR is a value, and the production root would plan
        # its notification channel on an empty address.
        if [ -n "$ALERT_EMAIL" ]; then export TF_VAR_alert_email="$ALERT_EMAIL"; fi
        if [ -n "$ALERT_SMS_NUMBER" ]; then export TF_VAR_alert_sms_number="$ALERT_SMS_NUMBER"; fi
        export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
        code=0
        terraform -chdir="$TERRAFORM_ROOT" plan -input=false -no-color -detailed-exitcode "-lock=$LOCK" -out=plan.tfplan 2>&1 | tee "$RUNNER_TEMP/plan.txt" || code=$?
        echo "exitcode=$code" >> "$GITHUB_OUTPUT"
        changes=0
        if [ "$code" = "2" ]; then
          changes="$(terraform -chdir="$TERRAFORM_ROOT" show -json plan.tfplan \
            | jq '[.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])] | length')"
        fi
        echo "resource_changes=$changes" >> "$GITHUB_OUTPUT"
        echo "Resources to create, change or destroy: $changes"
        test "$code" != "1"
    # The public form of the plan, the one a comment or a summary may show: the repository names
    # no project, no project number and no bucket, and the runner masks the secrets in the logs and
    # in the summaries but knows nothing of the project number, which the resource names carry.
    # Written whatever the exit code, an error is worth reading too.
    - name: Public form of the plan
      if: always() && steps.plan.outcome != 'skipped'
      shell: bash
      env:
        GCP_PROJECT_ID: ${{ inputs.project-id }}
        TF_STATE_BUCKET: ${{ inputs.state-bucket }}
      run: |
        grep -v -E 'Refreshing state\.\.\.|^[a-z_.]+: (Reading\.\.\.|Read complete)' "$RUNNER_TEMP/plan.txt" \
          | sed -e "s#$GCP_PROJECT_ID#<PROJET_GCP>#g" -e "s#$TF_STATE_BUCKET#<BUCKET_TFSTATE>#g" -e 's#projects/[0-9]\{6,\}#projects/<NUMERO_PROJET>#g' \
          > "$RUNNER_TEMP/plan.public.txt" || true
    - name: Plan summary
      if: always() && inputs.summary == 'true' && steps.plan.outcome != 'skipped'
      shell: bash
      env:
        TERRAFORM_ROOT: ${{ inputs.root }}
        EXITCODE: ${{ steps.plan.outputs.exitcode }}
        RESOURCE_CHANGES: ${{ steps.plan.outputs.resource_changes }}
      run: |
        case "$EXITCODE" in
          0) verdict="No change: the infrastructure already matches this commit." ;;
          2) if [ "$RESOURCE_CHANGES" = "0" ]; then
               verdict="Output values only: the infrastructure already matches this commit, nothing to approve."
             else
               verdict="Changes: this commit changes $RESOURCE_CHANGES resource(s) of the infrastructure."
             fi ;;
          *) verdict="Plan failed: read the job log." ;;
        esac
        {
          echo "### Terraform plan, \`$TERRAFORM_ROOT\`"
          echo
          echo "$verdict"
          echo
          echo '```'
          head -c 60000 "$RUNNER_TEMP/plan.public.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    # The saved plan is what is applied: exactly what the summary shows, not a second plan computed
    # a minute later.
    - name: terraform apply
      if: inputs.apply == 'true' && steps.plan.outputs.exitcode == '2'
      shell: bash
      env:
        TERRAFORM_ROOT: ${{ inputs.root }}
      run: terraform -chdir="$TERRAFORM_ROOT" apply -input=false -no-color plan.tfplan
    - name: Nothing to apply
      if: inputs.apply == 'true' && steps.plan.outputs.exitcode == '0'
      shell: bash
      run: echo "The infrastructure already matches master."
