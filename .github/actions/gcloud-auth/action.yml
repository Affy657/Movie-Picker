name: "GCP auth + gcloud"
description: "Authenticates the runner on GCP with the CI service account JSON key, then installs gcloud. The only place to rewrite for Workload Identity Federation (DEBT-002)."
inputs:
  credentials-json:
    description: "Service account JSON key (GCP_SA_KEY secret)"
    required: true
  project-id:
    description: "GCP project (GCP_PROJECT_ID secret)"
    required: true
runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ inputs.credentials-json }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      with:
        project_id: ${{ inputs.project-id }}
