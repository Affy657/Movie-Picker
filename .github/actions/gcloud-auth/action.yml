name: "Auth GCP + gcloud"
description: "Authentifie le runner sur GCP avec la clé JSON du compte de service de la CI, puis installe gcloud. Seul endroit à réécrire pour passer à la fédération d'identité (DEBT-002)."
inputs:
  credentials-json:
    description: "Clé JSON du compte de service (secret GCP_SA_KEY)"
    required: true
  project-id:
    description: "Projet GCP (secret GCP_PROJECT_ID)"
    required: true
runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ inputs.credentials-json }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      with:
        project_id: ${{ inputs.project-id }}
