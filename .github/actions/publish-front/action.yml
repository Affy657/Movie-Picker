name: "Publish a web build to S3"
description: "Uploads a dist folder to the web bucket in three passes: hashed assets as immutable, then unhashed files and prerendered routes as no-cache, index.html last. Shared by the deployment and the rollback: a flat aws s3 sync would upload index.html and the service worker with the CloudFront default cache and desynchronise installed PWAs from their bundles."
inputs:
  dist:
    description: "Build folder to publish"
    required: true
  bucket:
    description: "Web S3 bucket name (AWS_S3_BUCKET secret)"
    required: true
runs:
  using: composite
  steps:
    - name: "S3, step 1: hashed assets (entry points excluded)"
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
        AWS_S3_BUCKET: ${{ inputs.bucket }}
      run: |
        aws s3 sync "$DIST/" "s3://$AWS_S3_BUCKET/" \
          --exclude "index.html" \
          --exclude "sw.js" \
          --exclude "manifest.webmanifest" \
          --exclude "sitemap.xml" \
          --exclude "prerendered/*" \
          --exclude "route-assets.json" \
          --exclude "*.map" \
          --cache-control "public, max-age=31536000, immutable"
    - name: "S3, step 2: service worker and manifest (no-cache)"
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
        AWS_S3_BUCKET: ${{ inputs.bucket }}
      run: |
        aws s3 cp "$DIST/sw.js" "s3://$AWS_S3_BUCKET/sw.js" \
          --cache-control "no-cache, no-store, must-revalidate" --content-type "application/javascript"
        aws s3 cp "$DIST/manifest.webmanifest" "s3://$AWS_S3_BUCKET/manifest.webmanifest" \
          --cache-control "no-cache, must-revalidate" --content-type "application/manifest+json"
    - name: "S3, sitemap.xml (short cache, application/xml)"
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
        AWS_S3_BUCKET: ${{ inputs.bucket }}
      run: |
        aws s3 cp "$DIST/sitemap.xml" "s3://$AWS_S3_BUCKET/sitemap.xml" \
          --cache-control "public, max-age=3600, must-revalidate" --content-type "application/xml; charset=utf-8"
    # Prerendered routes. Each file is uploaded under an **extensionless** S3 key equal to the
    # route path: `/decouvrir` becomes the key `decouvrir`. That is what gets them served without
    # touching the infrastructure: the S3 origin is a REST origin, it has no per-folder index
    # document, so `decouvrir/index.html` would never have been served for `/decouvrir`:
    # CloudFront would have hit its 403/404 fallback to `/index.html`, the generic SPA shell. An
    # exact key answers 200 directly.
    # `Content-Type` is explicit for the same reason as `sw.js`: an extensionless key otherwise
    # leaves as `application/octet-stream`, which the browser downloads instead of displaying.
    # The SPA fallback stays in place for every other route, nothing is removed.
    - name: "S3, prerendered routes (extensionless keys, no-cache)"
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
        AWS_S3_BUCKET: ${{ inputs.bucket }}
      run: |
        set -eo pipefail
        MANIFEST="$DIST/prerendered/manifest.json"
        if [ ! -f "$MANIFEST" ]; then
          echo "::error::$MANIFEST missing: the build produced no prerendered route."
          exit 1
        fi
        count=0
        while IFS=$'\t' read -r route file; do
          key="${route#/}"
          echo "prerendered $route → key $key"
          aws s3 cp "$DIST/prerendered/$file" "s3://$AWS_S3_BUCKET/$key" \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          count=$((count + 1))
        done < <(jq -r '.[] | "\(.route)\t\(.file)"' "$MANIFEST")
        if [ "$count" = "0" ]; then
          echo "::error::The prerender manifest is empty."
          exit 1
        fi
        echo "$count prerendered routes published."
    - name: "S3, step 3: index.html last (entry point)"
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
        AWS_S3_BUCKET: ${{ inputs.bucket }}
      run: |
        aws s3 cp "$DIST/index.html" "s3://$AWS_S3_BUCKET/index.html" \
          --cache-control "no-cache, must-revalidate" --content-type "text/html"
