# Scheduled security scan: complements Dependabot (monthly updates) by catching the CVEs
# disclosed between two bumps, on dependencies that are already pinned.
#   - Weekly (Monday) + manually triggerable.
#   - Fails on High/Critical → notification through the scheduled-run failure e-mail.
#   - No cloud secret required (audits + filesystem scan only).

name: 🛡️ Security scan (scheduled)

on:
  schedule:
    - cron: "17 4 * * 1" # Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: 🛡️ Dependency + filesystem audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-cache
      - run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      - name: NuGet audit (fail on High / Critical)
        run: |
          set -o pipefail
          OUTPUT=$(dotnet list apps/api-dotnet/MoviePicker.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -Eq '\b(High|Critical)\b'; then
            echo "::error::High/Critical NuGet vulnerabilities detected."
            exit 1
          fi
      - name: Filesystem scan (Trivy; vulnerable npm + NuGet deps in lockfiles; replaces pnpm audit since the npm endpoint was removed on 2026-07-15, see pnpm/pnpm#11265)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          cache: true
