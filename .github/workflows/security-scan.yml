# Scan sécurité planifié — complète Dependabot (updates mensuels) en attrapant les CVE
# divulguées entre deux bumps, sur des dépendances déjà épinglées.
#   - Hebdomadaire (lundi) + déclenchable à la main.
#   - Échoue sur High/Critical → notification via l'e-mail d'échec de run planifié.
#   - Aucun secret cloud requis (audits + scan filesystem uniquement).

name: Security scan (planifié)

on:
  schedule:
    - cron: "17 4 * * 1" # lundi 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "10.0.x"

jobs:
  scan:
    name: Audit dépendances + filesystem
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit npm (échoue si high/critical)
        run: pnpm audit --audit-level=high
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api-dotnet/**/*.csproj', 'apps/api-dotnet/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      - name: Audit NuGet (échoue si High / Critical)
        run: |
          set -o pipefail
          OUTPUT=$(dotnet list apps/api-dotnet/MoviePicker.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -Eq '\b(High|Critical)\b'; then
            echo "::error::Vulnérabilités NuGet High/Critical détectées."
            exit 1
          fi
      - name: Scan filesystem (Trivy — deps vulnérables dans les lockfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          cache: true
