# Scheduled security scan: complements Dependabot (monthly updates) by catching the CVEs
# disclosed between two bumps, on dependencies that are already pinned.
#   - Weekly (Monday) + manually triggerable. GitHub starts the scheduled runs of this
#     repository about five hours late (observed 09:24 to 10:54 UTC for a 04:17 cron): the
#     delay is the platform's, not a sign that the schedule is broken.
#   - Fails on High/Critical → notification through the scheduled-run failure e-mail.
#   - No cloud secret required (audits + filesystem scan only). The image production runs is
#     scanned at its build and again at its promotion, then never: a CVE of the runtime base image
#     published between two deployments would wait for the next one. The base image is public
#     and pinned by digest in the Dockerfile, so the same scan runs here every week on the very
#     layers production serves, with no identity. The Terraform tree gets its misconfiguration
#     scan on the same cron, `check:terraform` only reads its syntax.
# The same cron carries the Letterboxd canary: the real watchlist client reads the witness
# account named by the LETTERBOXD_CANARY_USERNAME variable, so a markup change on their side
# opens a ticket here within the week instead of silently killing every sync. The job does not
# exist while the variable is unset.

name: 🛡️ Security scan (scheduled)

on:
  schedule:
    - cron: "17 4 * * 1" # Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: 🛡️ Dependency + filesystem audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-cache
      - run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      - name: NuGet audit (fail on High / Critical)
        run: |
          set -o pipefail
          OUTPUT=$(dotnet list apps/api-dotnet/MoviePicker.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -Eq '\b(High|Critical)\b'; then
            echo "::error::High/Critical NuGet vulnerabilities detected."
            exit 1
          fi
      - name: Filesystem scan (Trivy; vulnerable npm + NuGet deps in lockfiles; replaces pnpm audit since the npm endpoint was removed on 2026-07-15, see pnpm/pnpm#11265)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          cache: true
      - name: Runtime base image of the API, as the Dockerfile pins it
        id: base-image
        run: |
          set -eo pipefail
          image="$(grep -oE '^FROM +mcr\.microsoft\.com/dotnet/aspnet:[^ ]+' apps/api-dotnet/MoviePicker.Api/Dockerfile | head -1 | awk '{ print $2 }')"
          if [ -z "$image" ]; then
            echo "::error::No aspnet base image found in the Dockerfile: the weekly scan of the served layers has nothing to scan."
            exit 1
          fi
          echo "Base image: $image"
          echo "ref=$image" >> "$GITHUB_OUTPUT"
      - name: Runtime base image scan (Trivy; OS packages and .NET runtime production serves)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.base-image.outputs.ref }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          cache: true
      - name: Terraform misconfiguration scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          cache: true

  letterboxd-canary:
    name: 🐤 Letterboxd markup canary
    if: vars.LETTERBOXD_CANARY_USERNAME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Read the witness watchlist through the real client
        id: canary
        run: >-
          dotnet test apps/api-dotnet/MoviePicker.Api.Tests/MoviePicker.Api.Tests.csproj
          -c Debug --filter Category=Canary
        env:
          LETTERBOXD_CANARY_USERNAME: ${{ vars.LETTERBOXD_CANARY_USERNAME }}
      - name: Open the ticket once, then keep it fed while the markup stays broken
        if: failure() && steps.canary.outcome == 'failure'
        run: |
          gh label create letterboxd-canary --force --color B60205 \
            --description "The Letterboxd watchlist markup no longer matches the sync client" >/dev/null
          existing="$(gh issue list --label letterboxd-canary --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing on $(date -u +%F): $RUN_URL"
          else
            body="The weekly canary could not read the witness watchlist with the real client, so"
            body="$body LetterboxdWatchlistClient reads nothing for every user until its GeneratedRegex"
            body="$body patterns follow the new markup."
            gh issue create --label letterboxd-canary \
              --title "Letterboxd watchlist markup changed, every sync now fails" \
              --body "$(printf '%s\n\nRun: %s\nFile: %s' "$body" "$RUN_URL" \
                apps/api-dotnet/MoviePicker.Api/Infrastructure/Letterboxd/LetterboxdWatchlistClient.cs)"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
