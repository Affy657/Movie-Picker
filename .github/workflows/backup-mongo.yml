# Daily backup of the production database, with a verified restore before publication.
#
# Why: the Atlas free tier provides no snapshot. Without this workflow, a buggy data migration
# (DataMigrationRunner applies migrations at the start of every revision, and replays the ones
# that failed) or an operator mistake is unrecoverable. The Cloud Run rollback restores code,
# never data.
#
# The archive is uploaded under `pending/`, **read back from Cloud Storage**, restored into a
# disposable MongoDB on the runner, and only then moved to its final location. What is tested is
# what gets published: an archive that fails the restore never becomes the backup of the day, and
# the round trip covers a partial upload as much as a corrupted dump.
#
# What the verification proves: the object in the bucket can be read back, restored, and holds a
# non-empty application database. What it does not prove: transactional consistency across
# collections, `mongodump` without `--oplog` reads collections one after the other, so a
# transaction committed during the dump can be half in it. `--oplog` requires a dump of the whole
# instance and extra permissions; to be decided if the write volume grows.
#
# The URI is read from Secret Manager rather than duplicated as a GitHub secret: a single source.
# It is `MONGODB_BACKUP_URI`, not the URI of the API: an Atlas user that can only read the
# production database, with that database in the path, so that the dump covers it and nothing
# else (`mongodump` takes the database of the URI as its `--db`). Until that secret has a
# version (DEBT-053, the Atlas user is a console gesture), the dump falls back on `MONGODB_URI`
# with a warning, as it ran until 2026-09-21: as the cluster administrator the API also used,
# archiving every database of the cluster. The fallback and the second binding leave with the
# debt entry.
#
# The job runs in the `backup` environment, whose identity (`module "backup"` of the production
# root module of `infra/terraform`) can read that one secret and write that one bucket, and
# nothing else: the deployment identity no longer reads the database, and a compromised
# deployment cannot dump it. The bucket, its versioning and its two retention rules (30 days for
# the daily archives and the pending area, 400 days for the monthly copies under `monthly/`) are
# described there too. What remains by hand is the `BACKUP_BUCKET` repository variable
# (Settings / Secrets and variables / Actions / Variables) and the environment itself, with the
# `GCP_PROJECT_ID`, `GCP_WORKLOAD_IDENTITY_PROVIDER` and `GCP_SERVICE_ACCOUNT` secrets, and the
# version of `MONGODB_BACKUP_URI` itself (a secret value never goes through Terraform).
#
# The bucket holds personal data (e-mail addresses, password hashes): public access forbidden,
# and the archive is never published as a GitHub artifact. The run log is public, like every
# Actions log of this repository: it names the collections, never their document counts.
#
# Scheduled at 02:31 UTC, but GitHub starts the scheduled runs of this repository about five
# hours late, every day (observed 07:36 to 08:03 UTC over a week): the dump is taken around
# 10:00 Paris, during activity, not at night. Without `--oplog` that is where the consistency
# limit above bites first. The cron is kept: an earlier one would only shift the delay.
#
# Restoring an archive into the production cluster is described in
# `docs/runbook-mongodb-restore.md`.

name: 💾 MongoDB backup

on:
  schedule:
    - cron: "31 2 * * *" # every day, 02:31 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-mongo
  cancel-in-progress: false

env:
  MDB_TOOLS_VERSION: "100.18.0"
  MDB_TOOLS_SHA256: "3f23538c421793ecf5b4c44f0cc6ddf4e17ffd492ee616ef58e7b3148afb1d29"
  # Pinned by digest: this instance receives a full copy of the production database. Same digest
  # as the MongoDB of the CI test jobs (`ci-cd.yml`), `scripts/check-tool-versions.mjs` keeps
  # both on the digest `mongo:8` currently resolves to.
  MONGO_IMAGE: "mongo:8@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b"

jobs:
  backup:
    name: 💾 Dump, verify by restoring, then publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Talks to GCP: `backup` environment, whose branch policy is what the federation trusts, and
    # whose identity is the only one that can read the database URI.
    environment: backup
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the configuration
        env:
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          if [ -z "$BACKUP_BUCKET" ]; then
            echo "::error::BACKUP_BUCKET variable missing: no backup is performed."
            echo "::error::Create the bucket then the variable, commands at the top of this file."
            exit 1
          fi
          echo "Destination bucket: gs://$BACKUP_BUCKET"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gcloud-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}

      # Tools pinned by version *and* by checksum, as the actions are by SHA and the images by
      # digest: an archive substituted upstream does not get through.
      - name: Install mongodump / mongorestore
        run: |
          set -eo pipefail
          ARCHIVE_NAME="mongodb-database-tools-ubuntu2404-x86_64-${MDB_TOOLS_VERSION}"
          curl -sSL --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/mongotools.tgz" \
            "https://fastdl.mongodb.org/tools/db/${ARCHIVE_NAME}.tgz"
          echo "${MDB_TOOLS_SHA256}  $RUNNER_TEMP/mongotools.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mongotools"
          tar xzf "$RUNNER_TEMP/mongotools.tgz" --strip-components=2 \
            -C "$RUNNER_TEMP/mongotools" \
            "${ARCHIVE_NAME}/bin/mongodump" "${ARCHIVE_NAME}/bin/mongorestore"
          echo "$RUNNER_TEMP/mongotools" >> "$GITHUB_PATH"

      - name: Dump production
        id: dump
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -eo pipefail
          if URI="$(gcloud secrets versions access latest --secret=MONGODB_BACKUP_URI --project="$GCP_PROJECT_ID" 2>/dev/null)" && [ -n "$URI" ]; then
            echo "Dump taken with MONGODB_BACKUP_URI, the read-only user of the production database."
          elif URI="$(gcloud secrets versions access latest --secret=MONGODB_URI --project="$GCP_PROJECT_ID")"; then
            echo "::warning::MONGODB_BACKUP_URI has no version yet: the dump runs with MONGODB_URI, the URI of the API. Add the version (DEBT-053), then drop this fallback."
          else
            echo "::error::Neither MONGODB_BACKUP_URI nor MONGODB_URI could be read: the backup identity needs roles/secretmanager.secretAccessor on the first (module backup of infra/terraform), and the secret a version."
            exit 1
          fi
          echo "::add-mask::$URI"
          # Database name carried by the URI path. The pattern rejects a host name (it contains
          # dots): without a database in the path, fall back to the default the API itself applies
          # (ServiceCollectionExtensions: mongoUrl.DatabaseName ?? "moviepicker").
          DB_NAME="${URI##*/}"
          DB_NAME="${DB_NAME%%\?*}"
          if ! printf '%s' "$DB_NAME" | grep -qE '^[A-Za-z0-9_-]+$'; then
            DB_NAME="moviepicker"
            echo "::warning::No database name in the URI, verification aligned with the application default '$DB_NAME'."
          fi
          echo "Database backed up and verified: $DB_NAME"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ARCHIVE="$RUNNER_TEMP/moviepicker-${STAMP}.archive.gz"
          mongodump --uri="$URI" --archive="$ARCHIVE" --gzip
          SIZE="$(stat -c%s "$ARCHIVE")"
          echo "Archive: $ARCHIVE ($SIZE bytes)"
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Suspicious archive (${SIZE} bytes): the dump is probably empty."
            exit 1
          fi
          {
            echo "archive=$ARCHIVE"
            echo "size=$SIZE"
            echo "stamp=$STAMP"
            echo "db_name=$DB_NAME"
          } >> "$GITHUB_OUTPUT"

      # Pending area: nothing must land at the final location before being read back and restored.
      # The prefix derives from STAMP, never from a second `date` call, otherwise a run straddling a
      # month change files the archive in the wrong folder.
      - name: Upload the archive to the pending area
        id: upload
        env:
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          ARCHIVE: ${{ steps.dump.outputs.archive }}
          STAMP: ${{ steps.dump.outputs.stamp }}
        run: |
          set -eo pipefail
          NAME="moviepicker-${STAMP}.archive.gz"
          PENDING="gs://${BACKUP_BUCKET}/pending/${NAME}"
          FINAL="gs://${BACKUP_BUCKET}/mongodb/${STAMP:0:4}/${STAMP:4:2}/${NAME}"
          if ! gcloud storage cp "$ARCHIVE" "$PENDING"; then
            echo "::error::Write refused on gs://${BACKUP_BUCKET}: grant roles/storage.objectAdmin to the CI service account."
            exit 1
          fi
          {
            echo "pending=$PENDING"
            echo "final=$FINAL"
          } >> "$GITHUB_OUTPUT"
          echo "Uploaded to the pending area: $PENDING"

      # What sets a backup apart from a file: the proof that it can be read back. The copy under
      # test is the one read back from Cloud Storage, not the one left on the runner, otherwise a
      # truncated upload would pass the verification unseen.
      - name: Read back and restore the uploaded archive
        env:
          PENDING: ${{ steps.upload.outputs.pending }}
          EXPECTED_SIZE: ${{ steps.dump.outputs.size }}
          DB_NAME: ${{ steps.dump.outputs.db_name }}
        run: |
          set -eo pipefail
          FETCHED="$RUNNER_TEMP/readback.archive.gz"
          gcloud storage cp "$PENDING" "$FETCHED"
          FETCHED_SIZE="$(stat -c%s "$FETCHED")"
          if [ "$FETCHED_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "::error::Object read back is ${FETCHED_SIZE} bytes against ${EXPECTED_SIZE} uploaded: incomplete upload."
            exit 1
          fi
          # Replica set as in production: the only topology where IUnitOfWork transactions work,
          # hence the only one proving that the restore gives a database the API can really run on.
          docker run -d --name mongo-verify -p 27017:27017 "$MONGO_IMAGE" --replSet rs0 --bind_ip_all
          READY=0
          for _ in $(seq 1 30); do
            if docker exec mongo-verify mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              READY=1; break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "::error::The verification MongoDB never answered: the archive cannot be validated."
            exit 1
          fi
          docker exec mongo-verify mongosh --quiet --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          PRIMARY=0
          for _ in $(seq 1 30); do
            if [ "$(docker exec mongo-verify mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; then
              PRIMARY=1; break
            fi
            sleep 2
          done
          if [ "$PRIMARY" != "1" ]; then
            echo "::error::The verification replica set never became primary."
            exit 1
          fi
          mongorestore --uri="mongodb://127.0.0.1:27017/?directConnection=true" --archive="$FETCHED" --gzip
          # The database name is validated above against ^[A-Za-z0-9_-]+$: injection impossible.
          printf 'const EXPECTED_DB = "%s";\n' "$DB_NAME" > "$RUNNER_TEMP/verify.js"
          cat >> "$RUNNER_TEMP/verify.js" <<'JS'
          const target = db.getSiblingDB(EXPECTED_DB);
          const names = target.getCollectionNames();
          const empty = names.filter((name) => target.getCollection(name).countDocuments() === 0);
          print(`${EXPECTED_DB}: ${names.length} collection(s), ${empty.length} empty`);
          for (const name of names) {
            print(`  ${name}${empty.includes(name) ? " (empty)" : ""}`);
          }
          if (names.length === 0 || empty.length === names.length) {
            print(`Database ${EXPECTED_DB} is missing or empty in the restored archive.`);
            quit(1);
          }
          JS
          docker cp "$RUNNER_TEMP/verify.js" mongo-verify:/verify.js
          docker exec mongo-verify mongosh --quiet --file /verify.js

      # The first verified archive of each month is copied under `monthly/`, where the bucket
      # keeps it 400 days: the daily archives leave after 30 days, and a corruption noticed later
      # than that would otherwise have no clean copy left to go back to.
      - name: Publish the verified archive
        env:
          PENDING: ${{ steps.upload.outputs.pending }}
          FINAL: ${{ steps.upload.outputs.final }}
          STAMP: ${{ steps.dump.outputs.stamp }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          set -eo pipefail
          gcloud storage mv "$PENDING" "$FINAL"
          gcloud storage ls -l "$FINAL"
          echo "Backup of the day: $FINAL"
          if [ "${STAMP:6:2}" = "01" ]; then
            MONTHLY="gs://${BACKUP_BUCKET}/monthly/${FINAL##*/}"
            gcloud storage cp "$FINAL" "$MONTHLY"
            echo "Monthly copy: $MONTHLY"
          fi

      # An archive that failed the restore must not stay in the bucket: it would be the most
      # recent file there, the one grabbed during an incident.
      - name: Remove the unverified archive
        if: failure() && steps.upload.outputs.pending != ''
        env:
          PENDING: ${{ steps.upload.outputs.pending }}
        run: |
          echo "::warning::Verification failed, removing $PENDING"
          gcloud storage rm "$PENDING" || true

      - name: Stop the verification MongoDB
        if: always()
        run: docker rm -f mongo-verify 2>/dev/null || true
