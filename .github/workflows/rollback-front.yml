# Web rollback (S3 + CloudFront): republishes a build archived by `deploy-front`.
#   - Manually triggered (workflow_dispatch).
#   - Empty `commit` input → the previous build, second most recent `front-dist-*` artifact, the
#     most recent one being by construction the one served (the archive is taken after the S3 upload).
#   - No gate replayed: the artifact went through the whole chain when it was deployed. That only
#     holds for archives uploaded by a `deploy.yml` run on `master`, so any other `front-dist-*`
#     artifact of the repository (a pull request run can upload one) is ignored.
#
# The hosting keeps no versions: `aws s3 sync` overwrites, and the previous build only survives in
# the `front-dist-<sha>` artifact archived by `deploy-front` (30 days). Republishing that artifact
# with a bare `aws s3 sync` would upload `index.html` and the service worker with the CloudFront
# default cache and desynchronise installed PWAs from their bundles: an outage added to the one
# being repaired. That is why this workflow goes through the same composite actions as the
# deployment, `publish-front` then `verify-front`, without rewriting anything here.
#
# A commit that does not touch the web app produces no artifact: `commit` must name a commit that
# was deployed on the web side, the artifact list says which.

name: ⏪ Rollback web (S3 + CloudFront)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "SHA of the commit whose build is republished, 7+ characters (empty = previous build)"
        required: false
        type: string

permissions:
  contents: read

# Same group as `deploy.yml`: two simultaneous publications would step on each other on S3.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Same version as `deploy.yml` and as the `@sentry/cli` of the lockfile, checksum verified: the
# binary runs in a job holding the AWS deploy role.
env:
  SENTRY_CLI_VERSION: "2.58.6"
  SENTRY_CLI_LINUX_X86_64_BINARY_SHA256: "36b689311b399d9332950d84f4299aee682d2d290a770a77372b30a74f7e7add"

jobs:
  rollback:
    name: ⏪ Republish an archived web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `--paginate` because the CI artifacts (coverage, traces, OpenAPI, seven days of retention)
      # drown the `front-dist-*` ones on the first page.
      - name: Pick the archive to republish
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -eo pipefail
          if [ -n "$COMMIT" ] && ! printf '%s' "$COMMIT" | grep -qE '^[0-9a-f]{7,40}$'; then
            echo "::error::'$COMMIT' is not a commit SHA (7 to 40 hexadecimal characters)."
            exit 1
          fi
          # Artifacts live 30 days, so deploy runs older than that cannot own an eligible archive.
          since="$(date -u -d '31 days ago' +%Y-%m-%d)"
          deploy_runs="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=master&created=%3E%3D$since&per_page=100" \
            --jq '.workflow_runs[] | select(.head_repository.fork | not) | .id' | jq -sc '.')"
          all="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            | jq -r --argjson deploy_runs "$deploy_runs" '.artifacts[]
                  | select(.name | startswith("front-dist-"))
                  | select(.expired | not)
                  | select(.workflow_run.head_branch == "master")
                  | select(.workflow_run.head_repository_id == .workflow_run.repository_id)
                  | select(.workflow_run.id as $id | $deploy_runs | index($id))
                  | "\(.created_at)\t\(.workflow_run.id)\t\(.name)"' | sort -r)"
          if [ -z "$all" ]; then
            echo "::error::No front-dist-* artifact produced by a deploy.yml run on master: nothing to republish."
            exit 1
          fi
          echo "Available archives (most recent first):"
          printf '%s\n' "$all"
          if [ -n "$COMMIT" ]; then
            chosen="$(printf '%s\n' "$all" | awk -F'\t' -v prefix="front-dist-$COMMIT" 'index($3, prefix) == 1')"
            count="$(printf '%s' "$chosen" | grep -c . || true)"
            if [ "$count" != "1" ]; then
              echo "::error::$count archive(s) for commit '$COMMIT': exactly one is needed. Give a longer SHA or pick one from the list above."
              exit 1
            fi
          else
            chosen="$(printf '%s\n' "$all" | sed -n '2p')"
            if [ -z "$chosen" ]; then
              echo "::error::Only one archive exists, the one being served: nothing older to republish. Give a commit or redeploy."
              exit 1
            fi
          fi
          run_id="$(printf '%s' "$chosen" | cut -f2)"
          name="$(printf '%s' "$chosen" | cut -f3)"
          echo "Selected archive: $name (run $run_id)"
          {
            echo "run_id=$run_id"
            echo "name=$name"
            echo "sha=${name#front-dist-}"
          } >> "$GITHUB_OUTPUT"
      - name: Download the archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.pick.outputs.run_id }}
          NAME: ${{ steps.pick.outputs.name }}
        run: |
          set -eo pipefail
          gh run download "$RUN_ID" -n "$NAME" -D apps/web/dist
          for f in index.html sw.js manifest.webmanifest sitemap.xml prerendered/manifest.json; do
            if [ ! -f "apps/web/dist/$f" ]; then
              echo "::error::The archive does not contain $f: this is not a complete deploy-front build."
              exit 1
            fi
          done
          echo "Build $NAME ready to republish."
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - name: Publish the build to S3 (immutable assets, then no-cache, index.html last)
        uses: ./.github/actions/publish-front
        with:
          dist: apps/web/dist
          bucket: ${{ secrets.AWS_S3_BUCKET }}
      - name: Invalidate CloudFront and verify the served web build
        uses: ./.github/actions/verify-front
        with:
          dist: apps/web/dist
          distribution-id: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
          public-origins: ${{ vars.ALLOWED_ORIGINS }}
      # The republished bundle carries the release of its original commit: Sentry must know it is
      # live again, otherwise the errors that follow read as a regression of the release that was
      # just withdrawn.
      - name: Record the rollback in Sentry (web)
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_RELEASE: ${{ steps.pick.outputs.sha }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN missing, skipped"
            exit 0
          fi
          curl -sSfL --retry 3 --retry-all-errors \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64" -o sentry-cli
          echo "${SENTRY_CLI_LINUX_X86_64_BINARY_SHA256}  sentry-cli" | sha256sum -c -
          chmod +x sentry-cli
          extra=()
          if [ -n "$SENTRY_URL" ]; then extra+=(--url "$SENTRY_URL"); fi
          ./sentry-cli "${extra[@]}" deploys new --release "$SENTRY_RELEASE" -e production -n "front-rollback-$SENTRY_RELEASE"
