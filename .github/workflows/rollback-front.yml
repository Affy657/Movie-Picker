# Web rollback (Firebase Hosting): serves again a version `deploy-front` already built.
#   - Manually triggered (workflow_dispatch).
#   - Empty `commit` input → the version released before the one currently served.
#   - No gate replayed and nothing uploaded: the version went through the whole chain when it was
#     deployed, and Hosting still holds its files. That only holds for versions created by a
#     `deploy.yml` run, which `scripts/publish-front-firebase.mjs` labels with their commit and run
#     id: a version without those labels (published from a workstation) is never a target, as the
#     archive-based rollback ignored the artifacts of pull request runs.
#
# A commit that did not deploy the web app has no version: `commit` must name a commit that was
# deployed on the web side, the list printed by the script says which.

name: ⏪ Rollback web

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "SHA of the deployed commit to serve again, 7+ characters (empty = previous version)"
        required: false
        type: string

permissions:
  contents: read

# Same group as `deploy.yml`: two simultaneous releases would race on the site.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Same version as `deploy.yml` and as the `@sentry/cli` of the lockfile, checksum verified: the
# binary runs in a job holding cloud credentials.
env:
  SENTRY_CLI_VERSION: "2.58.6"
  SENTRY_CLI_LINUX_X86_64_BINARY_SHA256: "36b689311b399d9332950d84f4299aee682d2d290a770a77372b30a74f7e7add"
  FIREBASE_HOSTING_SITE: movie-picker-web

jobs:
  rollback:
    name: ⏪ Serve a previous web version again
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gcloud-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Release the previous version (or the one of the given commit)
        id: release
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -eo pipefail
          args=()
          if [ -n "$COMMIT" ]; then args+=(--commit "$COMMIT"); fi
          node scripts/rollback-front-firebase.mjs --site "$FIREBASE_HOSTING_SITE" "${args[@]}"
      - name: Verify the served web build
        uses: ./.github/actions/verify-front
        with:
          hosting-url: https://${{ env.FIREBASE_HOSTING_SITE }}.web.app
          public-origins: ${{ vars.ALLOWED_ORIGINS }}
      # The version served again carries the release of its original commit: Sentry must know it is
      # live again, otherwise the errors that follow read as a regression of the release that was
      # just withdrawn.
      - name: Record the rollback in Sentry (web)
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_RELEASE: ${{ steps.release.outputs.sha }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN missing, skipped"
            exit 0
          fi
          curl -sSfL --retry 3 --retry-all-errors \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64" -o sentry-cli
          echo "${SENTRY_CLI_LINUX_X86_64_BINARY_SHA256}  sentry-cli" | sha256sum -c -
          chmod +x sentry-cli
          extra=()
          if [ -n "$SENTRY_URL" ]; then extra+=(--url "$SENTRY_URL"); fi
          ./sentry-cli "${extra[@]}" deploys new --release "$SENTRY_RELEASE" -e production -n "front-rollback-$SENTRY_RELEASE"
