# API rollback (Cloud Run): routes the traffic to an earlier revision.
#   - Manually triggered (workflow_dispatch).
#   - Empty `revision` input → the most recent revision created BEFORE the one serving the
#     traffic. Not "the 2nd most recent": a deployment refused at validation leaves a newer
#     revision that never served, and the 2nd most recent is then the one already in production,
#     which a rollback would pin without changing anything.
#   - Cloud Run keeps the revisions: the rollback redeploys nothing, it routes traffic.
#   - `--to-revisions` PINS the traffic: while the service is pinned, `gcloud run deploy` no
#     longer routes anything to new revisions. The next deployment restores `latestRevision`
#     through `--to-latest` (see deploy.yml), which lifts the pin on its own.
#
# NB: deploy.yml no longer "deploys, then checks". Every revision leaves WITHOUT traffic, is
#     validated on its tagged URL, and is promoted only once green: a bad revision never reaches a
#     user, so there is no automatic rollback left to trigger. This workflow covers the cases the
#     chain cannot see: a regression noticed afterwards, a precise revision to target, an incident
#     unrelated to a deployment.
#
# NB: the web rollback is `rollback-front.yml`, which points a Hosting release back at a version
#     deploy-front built.
#
# The stage is an input, as in `deploy.yml`: the staging is where a rollback is rehearsed before
# the day it is needed in production (a rollback never exercised is a runbook, not a safety net).
# The image of the target revision must still exist in the registry: Cloud Run keeps its own copy
# only for the revisions that serve traffic, and the repository purges what is older than 30 days
# beyond the 30 most recent images (`infra/terraform`, module `artifact-registry`). The check
# runs before the traffic moves, so an unreachable target refuses the rollback instead of
# breaking the stage.

name: ⏪ Rollback API (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to roll back"
        type: choice
        required: true
        default: production
        options:
          - production
          - staging
      revision:
        description: "Target Cloud Run revision (empty = previous revision)"
        required: false
        type: string

permissions:
  contents: read

# Same group as `deploy.yml`: a rollback during a deployment, or the reverse, would step on each
# other's Cloud Run traffic.
concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

env:
  GCP_REGION: europe-west1
  GCP_ARTIFACT_REPO: movie-picker
  CLOUD_RUN_SERVICE_NAME: ${{ inputs.stage == 'production' && 'movie-picker-api' || 'movie-picker-api-staging' }}

jobs:
  rollback:
    name: ⏪ Roll back Cloud Run traffic (${{ inputs.stage }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gcloud-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Determine the target revision
        id: target
        env:
          INPUT_REV: ${{ inputs.revision }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -eo pipefail
          SERVING="$(gcloud run services describe "$CLOUD_RUN_SERVICE_NAME" --region "$GCP_REGION" --format=json \
            | jq -r '[.status.traffic[]? | select(.percent == 100) | .revisionName] | first // ""')"
          if [ -z "$SERVING" ]; then
            echo "::error::No revision serves 100% of the traffic (split in progress?): give the revision explicitly."
            exit 1
          fi
          echo "Serving revision: $SERVING"
          if [ -n "$INPUT_REV" ]; then
            TARGET="$INPUT_REV"
          else
            TARGET="$(gcloud run revisions list \
              --service "$CLOUD_RUN_SERVICE_NAME" --region "$GCP_REGION" \
              --sort-by=~metadata.creationTimestamp \
              --format='value(metadata.name)' \
              | awk -v serving="$SERVING" 'found { print; exit } $0 == serving { found = 1 }')"
          fi
          if [ -z "$TARGET" ]; then
            echo "::error::No revision older than $SERVING: nothing to roll back to."
            exit 1
          fi
          if [ "$TARGET" = "$SERVING" ]; then
            echo "::error::$TARGET already serves the traffic: a rollback to it would only pin the service."
            exit 1
          fi
          gcloud run revisions describe "$TARGET" --region "$GCP_REGION" --format=json > "$RUNNER_TEMP/target.json"
          RELEASE="$(jq -r '[.spec.containers[0].env[]? | select(.name == "SENTRY_RELEASE") | .value] | first // ""' "$RUNNER_TEMP/target.json")"
          IMAGE="$(jq -r '.status.imageDigest // .spec.containers[0].image // ""' "$RUNNER_TEMP/target.json")"
          # `images list` filtered on the digest rather than `images describe`: the latter also
          # reads Container Analysis, which the reader role does not cover (deploy.yml, same trap).
          REPO="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPO}/api"
          if [ "${IMAGE%@*}" != "$REPO" ] || [ -z "$(gcloud artifacts docker images list "$REPO" --filter="version=${IMAGE##*@}" --format='value(version)' 2>/dev/null)" ]; then
            echo "::error::The image of $TARGET ($IMAGE) is no longer in the registry: new instances of that revision could not start. Pick a more recent revision, or redeploy the commit."
            exit 1
          fi
          echo "Rolling back $SERVING -> $TARGET (release ${RELEASE:-unknown}, image still in the registry)"
          {
            echo "target=$TARGET"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"
      - name: Route 100% of the traffic
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE_NAME" \
            --region "$GCP_REGION" \
            --to-revisions "$TARGET=100"
      - name: Read the live service URL
        id: service
        run: |
          set -eo pipefail
          URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE_NAME" --region "$GCP_REGION" --format='value(status.url)')"
          echo "Service URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      # Same probes as the deployment, /health/ready included: an earlier revision can answer ok
      # without being ready, if a secret it expects has disappeared since. The release check
      # proves the traffic really moved to the target, not only that something answers.
      - name: Verify the stage after the switch
        uses: ./.github/actions/check-api-health
        with:
          url: ${{ steps.service.outputs.url }}
          public-url: ${{ secrets.VITE_API_URL }}
          public-url-expected: "true"
          expected-release: ${{ steps.target.outputs.release }}
