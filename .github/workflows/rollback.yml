# Rollback API (Cloud Run) : bascule le trafic vers une révision antérieure.
#   - Déclenché à la main (workflow_dispatch).
#   - Input `revision` vide → révision précédente (2e plus récente).
#   - Cloud Run conserve les révisions : le rollback ne redéploie rien, il route le trafic.
#   - `--to-revisions` ÉPINGLE le trafic : tant que le service est épinglé, `gcloud run deploy`
#     ne route plus rien vers les nouvelles révisions. Le déploiement suivant rebranche
#     `latestRevision` via `--to-latest` (cf. deploy.yml), ce qui lève l'épinglage tout seul.
#
# NB : deploy.yml ne déploie plus « puis vérifie ». Chaque révision part SANS trafic, est validée
#      sur son URL taguée, et n'est promue qu'une fois verte : une mauvaise révision n'atteint
#      jamais un utilisateur, donc il n'y a plus de retour arrière automatique à déclencher. Ce
#      workflow sert les cas que la chaîne ne peut pas voir : régression constatée après coup,
#      révision précise à cibler, incident sans rapport avec un déploiement.
#
# NB : le retour arrière du front est `rollback-front.yml`, qui republie un artefact
#      `front-dist-<sha>` archivé par deploy-front avec les mêmes passes S3 que le déploiement.

name: Rollback API (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Révision Cloud Run cible (vide = révision précédente)"
        required: false
        type: string

permissions:
  contents: read

# Même groupe que `deploy.yml` : un retour arrière pendant un déploiement, ou l'inverse, se
# marcheraient dessus sur le trafic Cloud Run.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_REGION: europe-west1
  CLOUD_RUN_SERVICE_NAME: movie-picker-api

jobs:
  rollback:
    name: Rollback trafic Cloud Run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gcloud-auth
        with:
          credentials-json: ${{ secrets.GCP_SA_KEY }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Déterminer la révision cible
        id: target
        env:
          INPUT_REV: ${{ inputs.revision }}
        run: |
          set -eo pipefail
          if [ -n "$INPUT_REV" ]; then
            TARGET="$INPUT_REV"
          else
            TARGET="$(gcloud run revisions list \
              --service "$CLOUD_RUN_SERVICE_NAME" --region "$GCP_REGION" \
              --sort-by=~metadata.creationTimestamp \
              --format='value(metadata.name)' | sed -n '2p')"
          fi
          if [ -z "$TARGET" ]; then
            echo "::error::Aucune révision cible déterminée."
            exit 1
          fi
          echo "Rollback vers la révision : $TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
      - name: Basculer 100% du trafic
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE_NAME" \
            --region "$GCP_REGION" \
            --to-revisions "$TARGET=100"
      - name: Lire l'URL du service en ligne
        id: service
        run: |
          set -eo pipefail
          URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE_NAME" --region "$GCP_REGION" --format='value(status.url)')"
          echo "Service URL : $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      # Mêmes sondes que le déploiement, /health/ready compris : une révision antérieure peut
      # répondre ok sans être prête, si un secret qu'elle attend a disparu depuis.
      - name: Vérifier la production après bascule
        uses: ./.github/actions/check-api-health
        with:
          url: ${{ steps.service.outputs.url }}
          public-url: ${{ secrets.VITE_API_URL }}
          public-url-expected: "true"
