# CodeQL — analyse statique de sécurité (SAST) native GitHub.
#   - Langages : C# (build manuel tracé) + JavaScript/TypeScript (sans build).
#   - Déclenché sur push/PR master + planifié hebdo (attrape les nouvelles règles CodeQL).
#   - Résultats visibles dans l'onglet Security → Code scanning.
# NB : si le "Default setup" CodeQL est activé dans Settings → Security, il faut le désactiver
#      pour utiliser ce workflow "Advanced" (les deux sont mutuellement exclusifs).

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "27 3 * * 1" # lundi 03:27 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  analyze:
    name: Analyse CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: csharp
            build-mode: manual
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Initialiser CodeQL
        uses: github/codeql-action/init@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build API .NET (tracé par CodeQL)
        if: matrix.language == 'csharp'
        run: dotnet build apps/api-dotnet/MoviePicker.slnx -c Debug
      - name: Analyse CodeQL
        uses: github/codeql-action/analyze@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          category: "/language:${{ matrix.language }}"
