# Applies a retention policy to Artifact Registry (the API images repository).
#   - Keeps the 10 most recent versions, deletes the others older than 30 days.
#   - GCP then applies the policy on its own (no direct deletion here).
#   - Monthly + manually triggerable. Service account requirement: artifactregistry.admin (or update).

name: 🧹 Artifact Registry cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *" # 1st of the month, 05:00 UTC

permissions:
  contents: read

env:
  GCP_REGION: europe-west1
  GCP_ARTIFACT_REPO: movie-picker

jobs:
  apply-policy:
    name: 🧹 Apply the retention policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reads GCP_SA_KEY: `production` environment, like every job carrying that secret.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gcloud-auth
        with:
          credentials-json: ${{ secrets.GCP_SA_KEY }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
      - name: set-cleanup-policies (keep the 10 most recent, purge > 30 days)
        run: |
          gcloud artifacts repositories set-cleanup-policies "$GCP_ARTIFACT_REPO" \
            --location="$GCP_REGION" \
            --policy=infra/artifact-registry-cleanup-policy.json \
            --no-dry-run
