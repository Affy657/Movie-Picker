# Terraform of `infra/terraform/`, the one place the infrastructure is changed from:
#   - on a pull request that touches it, `plan` of every root module, each posted as a sticky
#     comment on the PR (one comment per root, edited on every push), so that a change is reviewed
#     as the diff of the resources it will produce and a drift of the real infrastructure shows up
#     before a merge;
#   - on master, `plan` then `apply` behind the `production` environment, production first and the
#     staging after it (the staging root reads the production outputs through the remote state),
#     so that master and the infrastructure never disagree for longer than one run.
#
# Two identities, both keyless, both described in the production root module (`module "terraform"`
# and `module "terraform_plan"`): the pull request one is read-only, reads the states without
# taking the lock (`-lock=false`) and can be assumed only by a job of the `infra-plan`
# environment; the master one manages everything the root modules describe, hence its reach, and
# can be assumed only by a job of the `production` environment, which the branch policy reserves
# to master. The identifiers of both live as secrets of their environment (and, for the plan job,
# as Dependabot secrets, otherwise a provider bump would run without them): `GCP_PROJECT_ID`,
# `GCP_WORKLOAD_IDENTITY_PROVIDER`, `GCP_SERVICE_ACCOUNT` / `GCP_TERRAFORM_SERVICE_ACCOUNT`,
# `TF_STATE_BUCKET` and `ALERT_EMAIL`, the same names `scripts/terraform.mjs` reads locally from
# `.env`.
#
# `fmt` and `validate` stay in `ci-cd.yml` (`lint-terraform`), without credentials: this workflow
# only runs when there is something to plan. The binary version is pinned here, in `ci-cd.yml`,
# in `scripts/terraform.mjs` and in every root module; `pnpm run check:tools` keeps them equal.

name: 🏗️ Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
  push:
    branches: [master]
    paths:
      - "infra/terraform/**"
  workflow_dispatch:

permissions:
  contents: read

# One lock per state, and one run at a time for all of them: two applies never overlap, and a plan
# waits for a running apply so that it reads the state the apply leaves.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.16.3"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  plan:
    name: 🔍 Plan on the pull request (${{ matrix.root }})
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        root: [production, staging]
    env:
      TERRAFORM_ROOT: infra/terraform/environments/${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gcloud-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
      # `-lock=false`: a review must never block a deployment or an apply holding the lock.
      - name: terraform plan (read-only, without the lock)
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          root: ${{ env.TERRAFORM_ROOT }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
          alert-email: ${{ secrets.ALERT_EMAIL }}
          lock: "false"
      # One comment per root module, found again by its first line and edited in place: a PR that
      # is pushed ten times keeps one plan per root, the current one. The refresh lines are dropped
      # and the identifiers the repository keeps out of its files (project id and number, state
      # bucket) are replaced by their placeholders, as `infra/README.md` names them: the comment is
      # as public as the repository. Truncated when GitHub's limit is near, the full text stays in
      # the job log, where the secrets are masked.
      - name: Publish the plan on the pull request
        if: always() && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          set -eo pipefail
          marker="<!-- terraform-plan:${TERRAFORM_ROOT} -->"
          case "$EXITCODE" in
            0) verdict="No change: the infrastructure already matches this branch." ;;
            2) verdict="Changes: this branch would change the infrastructure, read the plan before merging." ;;
            *) verdict="Plan failed: read the [job log]($RUN_URL) before merging." ;;
          esac
          grep -v -E 'Refreshing state\.\.\.|^[a-z_.]+: (Reading\.\.\.|Read complete)' "$RUNNER_TEMP/plan.txt" \
            | sed -e "s#$GCP_PROJECT_ID#<PROJET_GCP>#g" -e "s#$TF_STATE_BUCKET#<BUCKET_TFSTATE>#g" -e 's#projects/[0-9]\{6,\}#projects/<NUMERO_PROJET>#g' \
            > "$RUNNER_TEMP/plan.public.txt" || true
          plan="$(head -c 60000 "$RUNNER_TEMP/plan.public.txt")"
          if [ "$(wc -c < "$RUNNER_TEMP/plan.public.txt")" -gt 60000 ]; then
            plan="$plan"$'\n'"... (truncated, the full plan is in the job log)"
          fi
          {
            echo "$marker"
            echo "### Terraform plan, \`$TERRAFORM_ROOT\`"
            echo
            echo "$verdict Commit \`${HEAD_SHA:0:8}\`, [run]($RUN_URL)."
            echo
            echo "<details><summary>Plan output</summary>"
            echo
            echo '```'
            echo "$plan"
            echo '```'
            echo
            echo "</details>"
          } > "$RUNNER_TEMP/comment.md"
          existing="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi
          echo "Plan published on #$PR_NUMBER (exit code $EXITCODE)."

  # The plan is saved and the apply replays that file: what is applied is exactly what the summary
  # shows, not a second plan computed a minute later.
  apply:
    name: 🚀 Plan and apply on master (production)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TERRAFORM_ROOT: infra/terraform/environments/production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gcloud-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
      - name: terraform plan
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          root: ${{ env.TERRAFORM_ROOT }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
          alert-email: ${{ secrets.ALERT_EMAIL }}
          out: tfplan
      - name: Plan summary
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          {
            echo "### Terraform plan, \`$TERRAFORM_ROOT\` (exit code $EXITCODE)"
            echo
            echo '```'
            head -c 60000 "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: terraform apply
        if: steps.plan.outputs.exitcode == '2'
        run: terraform -chdir="$TERRAFORM_ROOT" apply -input=false -no-color tfplan
      - name: Nothing to apply
        if: steps.plan.outputs.exitcode == '0'
        run: echo "The infrastructure already matches master."

  # After production, never beside it: the staging binds its identities to the federation and
  # shares the image repository, both read from the production outputs.
  apply-staging:
    name: 🚀 Plan and apply on master (staging)
    if: github.event_name != 'pull_request'
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TERRAFORM_ROOT: infra/terraform/environments/staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gcloud-auth
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
      - name: terraform plan
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          root: ${{ env.TERRAFORM_ROOT }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}
          project-id: ${{ secrets.GCP_PROJECT_ID }}
          out: tfplan
      - name: Plan summary
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          {
            echo "### Terraform plan, \`$TERRAFORM_ROOT\` (exit code $EXITCODE)"
            echo
            echo '```'
            head -c 60000 "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: terraform apply
        if: steps.plan.outputs.exitcode == '2'
        run: terraform -chdir="$TERRAFORM_ROOT" apply -input=false -no-color tfplan
      - name: Nothing to apply
        if: steps.plan.outputs.exitcode == '0'
        run: echo "The infrastructure already matches master."
