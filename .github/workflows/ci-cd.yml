# Movie Picker CI: monorepo (Vite/React web app, .NET API). **This workflow deploys nothing.**
#
# Deployment is a manual gesture, in `.github/workflows/deploy.yml`: a push to master runs the
# gates below and stops there. `deploy.yml` refuses to leave on a commit whose run of this workflow
# is not green, so the conclusion of a master run is what production consumes; keeping it honest
# is the reason this file exists.
#
# Path filtering: the "changes" job (dorny/paths-filter) computes 4 outputs web/api/e2e/infra; each
# job only runs when its lane is affected (skipped otherwise). workflow_dispatch forces the 4 lanes,
# and **so does master**: a commit touching neither `apps/` nor `scripts/` skipped the 9 test jobs
# and concluded `success` in 12 s, yet `deploy.yml` reads only that conclusion. A red code commit
# followed by a documentation commit gave a green run, hence an authorised deployment of code that
# was never validated. The filter stays useful on PRs and `v*` branches, where nothing deploys; on
# master, minutes are free since the repository went public, and the conclusion of a run must
# hold for the whole tree, not just the diff of the commit.
#   - Web lane: lint-web, test-web.
#   - API lane: lint-api, test-api, test-api-mongo.
#   - Infra lane: lint-terraform (fmt + validate on `infra/terraform/`).
#   - Cross-cutting: gitleaks (always), lint-workflows (always), npm/NuGet audit,
#     sonar (global analysis + blocking Quality Gate).
#   - E2E Playwright: blocking job + local run.
#   - Lighthouse is no longer here: it weighed 9 of the 27 minutes of a master run for a
#     measurement only a deployment consumed; it moved to `deploy.yml` without losing any of its
#     blocking power.
#
# Security hardening:
#   - Actions pinned by commit SHA (anti supply-chain); the # vX comment lets Dependabot propose updates.
#   - Docker images (.NET base, gitleaks, MongoDB) pinned by sha256 digest. The tools that no
#     Dependabot ecosystem follows (gitleaks image, actionlint and zizmor binaries, SonarScanner,
#     the MongoDB image) are listed by `scripts/check-tool-versions.mjs`, run during the weekly
#     maintenance pass.
#   - Least-privilege permissions (deny by default); checkout with persist-credentials: false.
#   - Secrets passed through env: (never interpolated directly into a run: block).
#   - Blocking SonarCloud Quality Gate: a red QG fails the job, hence forbids the deployment.
#   - concurrency: group ci-<ref>, cancel-in-progress on PRs / false on master.
#   - timeout-minutes on every job; NuGet / Turbo caches.

name: 🔍 CI

on:
  workflow_dispatch:
  # Restricted to durable branches: an ephemeral branch with an open PR triggered two runs for the
  # same commit (push + pull_request). It stays covered by pull_request.
  push:
    branches:
      - master
      - "v*"
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  NODE_VERSION: "22"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  ZIZMOR_VERSION: "1.30.1"
  ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  SONARSCANNER_VERSION: "11.3.0"
  # Same Terraform as `scripts/terraform.mjs` (image tag) and as `required_version` in the root
  # modules of `infra/terraform/environments/`: `scripts/check-tool-versions.mjs` compares the three.
  TERRAFORM_VERSION: "1.16.3"
  # `mongo:8` resolved on 2026-09-17 (8.3.11). A floating tag would let a MongoDB release change
  # what the transaction and index tests run against without any commit saying so.
  MONGO_IMAGE: "mongo:8@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b"

jobs:
  # Solo project: no external contribution is accepted, the licence forbids it and
  # `CONTRIBUTING.md` says so. A PR from a fork receives no secret, so its run would fail on
  # `sonar` for a reason that is not the proposed code, while spending the minutes quota.
  # `fork != true` covers the three triggers: on `push` and `workflow_dispatch` the `pull_request`
  # object is null, and null is not `true`.
  # The other jobs inherit the skip through their `needs: changes`.
  changes:
    name: 🧭 Change detection (path filtering)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.fork != true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
      api: ${{ steps.filter.outputs.api == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
      e2e: ${{ steps.filter.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
      infra: ${{ steps.filter.outputs.infra == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
    steps:
      # fetch-depth: 0 required: on push, paths-filter diffs against the previous commit through
      # git; without the full history it would have to fetch, which fails with
      # persist-credentials: false (no token). The full history avoids the fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/master'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/master'
        with:
          # `master` in both cases, and it is not an oversight: dorny/paths-filter special-cases
          # "base equals the pushed branch" and then compares against the previous commit. A
          # master push therefore diffs against its parent, a branch push against master. A
          # pseudo-ternary lived here, meant to pass an empty base on master, and it already
          # returned this same constant, but by accident: an empty string is falsy in a GitHub
          # Actions expression, so its "true" branch never won, for any ref. Writing the constant
          # removes the trap without changing anything in what is checked.
          base: master
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'eslint.config.mjs'
              - 'prettier.config.cjs'
              - 'configs/**'
              - 'scripts/**'
              - '.github/workflows/ci-cd.yml'
              - '.github/actions/**'
            e2e:
              - 'playwright.config.ts'
              - 'e2e/**'
            api:
              - 'apps/api-dotnet/**'
              - 'scripts/**'
              - '.github/workflows/ci-cd.yml'
              - '.github/actions/**'
            infra:
              - 'infra/terraform/**'
              - '.github/workflows/ci-cd.yml'

  gitleaks:
    name: 🔑 Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.fork != true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan working tree
        run: |
          docker run --rm -v "${PWD}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            dir --no-banner --redact --verbose --exit-code 1 /repo

  # Workflows are large YAML and bash files that neither check:architecture, nor ESLint, nor
  # Prettier look at: the chain guarding the code was itself guarded by nothing. The gate covers
  # the whole `.github/workflows/`, hence `deploy.yml` too, and it is unconditional like gitleaks:
  # a red master run forbids the deployment.
  #   - actionlint: syntax errors, invalid ${{ }} expressions, inconsistent permissions. It
  #     delegates `run:` blocks to shellcheck, preinstalled on GitHub runners. It only reads
  #     workflows, not composite actions.
  #   - zizmor: security audit of the workflows **and of the composite actions** in
  #     `.github/actions/`, where the S3 passes, the health probes and the GCP authentication now
  #     live. `medium` threshold: the repository is at 0 medium and 0 high, so the gate is green
  #     today and only catches serious findings (injection from an untrusted context, exposed
  #     secrets). Going down to `low` would mean handling 9 cosmetic findings. `--offline` so that
  #     the gate does not depend on the GitHub API.
  # `scripts/check-workflows.mjs` replays both tools locally in `verify:local`, through Docker.
  # The versions on both sides must stay aligned: changing one here without the other makes a
  # local gate green on what the CI refuses.
  lint-workflows:
    name: 🧹 Lint workflows (actionlint + zizmor)
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.fork != true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (+ shellcheck on run blocks)
        run: |
          set -eo pipefail
          curl -sSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor (security audit, medium threshold)
        run: |
          set -eo pipefail
          curl -sSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/zizmor.tgz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/zizmor.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/zizmor.tgz" -C "$RUNNER_TEMP" zizmor
          "$RUNNER_TEMP/zizmor" --offline --no-progress --min-severity medium --format plain .github/

  # The infrastructure description (`infra/terraform/`, roadmap Terraform lots) is read by nothing
  # else in this workflow: without this job a malformed or invalid root module would only be
  # discovered at the next `plan`. `fmt -check` on the whole tree, then `init -backend=false` and
  # `validate` on every root module of `infra/terraform/environments/`, discovered by glob so that
  # a second environment cannot be forgotten. `-lockfile=readonly`: a provider bumped in
  # `versions.tf` without its checksums in `.terraform.lock.hcl` fails here rather than letting two
  # machines validate against two provider builds. No backend, no credentials: the job never
  # reaches GCP. `scripts/check-terraform.mjs` replays it locally in `verify:local`, through the
  # Docker image pinned in `scripts/terraform.mjs`, at the version of `TERRAFORM_VERSION`.
  lint-terraform:
    name: 🧹 Lint Terraform (fmt + validate)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Provider cache directory
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
      - name: terraform fmt
        run: terraform fmt -check -diff -recursive infra/terraform
      - name: terraform validate (every root module)
        run: |
          set -eo pipefail
          for root in infra/terraform/environments/*/; do
            echo "::group::${root}"
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly -no-color
            terraform -chdir="$root" validate -no-color
            echo "::endgroup::"
          done

  lint-web:
    name: 🧹 Lint web (tsc + eslint + prettier)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-lintweb-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lintweb-${{ runner.os }}-
      - run: pnpm run check:architecture
      - run: pnpm run lint
      - run: pnpm run lint:eslint
      - run: pnpm run format:check

  lint-api:
    name: 🧹 Lint API .NET (format + build + OpenAPI)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Restore API .NET
        run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      - name: dotnet format (verify, roadmap § 31)
        run: dotnet format apps/api-dotnet/MoviePicker.slnx --verify-no-changes --verbosity minimal
      - name: Build API .NET (warnings → errors)
        run: dotnet build apps/api-dotnet/MoviePicker.slnx -c Release --no-restore -warnaserror
      - name: Export OpenAPI (artifact, roadmap § 32)
        env:
          SKIP_OPENAPI_BUILD: '1'
        run: node scripts/export-openapi.cjs
      - name: Web types aligned with the OpenAPI contract
        run: node scripts/check-openapi-types.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-v1
          path: artifacts/openapi-v1.json
          if-no-files-found: error
          retention-days: 7

  audit:
    name: 🛡️ Dependency audit (npm + NuGet)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: npm audit (Trivy; pnpm audit unavailable since the npm endpoint was removed on 2026-07-15, see pnpm/pnpm#11265)
        if: needs.changes.outputs.web == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: ./.github/actions/setup-dotnet-cache
        if: needs.changes.outputs.api == 'true'
      - name: Restore API .NET (for the NuGet audit)
        if: needs.changes.outputs.api == 'true'
        run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      - name: "NuGet audit: list vulnerabilities (informational)"
        if: needs.changes.outputs.api == 'true'
        run: dotnet list apps/api-dotnet/MoviePicker.slnx package --vulnerable --include-transitive
      - name: "NuGet audit: fail on High / Critical"
        if: needs.changes.outputs.api == 'true'
        run: |
          set -o pipefail
          OUTPUT=$(dotnet list apps/api-dotnet/MoviePicker.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -Eq '\b(High|Critical)\b'; then
            echo "::error::High/Critical NuGet vulnerabilities detected. Update, or suppress through <NuGetAuditSuppress> in Directory.Build.props (document the reason)."
            exit 1
          fi

  test-web:
    name: 🧪 Web tests + coverage
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-testweb-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-testweb-${{ runner.os }}-
      - run: pnpm run test:coverage --filter=web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: warn
          retention-days: 7

  test-api:
    name: 🧪 API .NET tests + coverage
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Unit tests + coverage
        run: |
          dotnet test apps/api-dotnet/MoviePicker.Api.Tests/MoviePicker.Api.Tests.csproj -c Debug \
            --collect:"XPlat Code Coverage" \
            --settings apps/api-dotnet/coverlet.runsettings \
            --results-directory ./coverage-unit
        env:
          MONGODB_URI: ""
      - name: API coverage gate (lines >= 90%, branches >= 78%)
        run: |
          set -eo pipefail
          report="$(find ./coverage-unit -name coverage.opencover.xml | head -1)"
          if [ -z "$report" ]; then
            echo "::error::OpenCover coverage report not found"
            exit 1
          fi
          fail=0
          seq="$(grep -m1 -o 'sequenceCoverage="[0-9.]*"' "$report" | grep -o '[0-9.]*')"
          branch="$(grep -m1 -o 'branchCoverage="[0-9.]*"' "$report" | grep -o '[0-9.]*')"
          echo "API line coverage:   ${seq}% (threshold 90%)"
          echo "API branch coverage: ${branch}% (threshold 78%)"
          if ! awk -v c="$seq" 'BEGIN { exit !(c + 0 >= 90) }'; then
            echo "::error::API line coverage ${seq}% < 90% required"
            fail=1
          fi
          if ! awk -v c="$branch" 'BEGIN { exit !(c + 0 >= 78) }'; then
            echo "::error::API branch coverage ${branch}% < 78% required"
            fail=1
          fi
          exit $fail
      - name: Integration tests
        run: dotnet test apps/api-dotnet/MoviePicker.Api.IntegrationTests/MoviePicker.Api.IntegrationTests.csproj -c Debug --verbosity normal
        env:
          MONGODB_URI: ""
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-api-unit
          path: coverage-unit
          if-no-files-found: warn
          retention-days: 7

  test-api-mongo:
    name: 🧪 API .NET tests on real MongoDB
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Start MongoDB as a replica set (transactions)
        run: |
          set -eo pipefail
          docker run -d --name mongo-it -p 27017:27017 "$MONGO_IMAGE" --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            if docker exec mongo-it mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-it mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for _ in $(seq 1 30); do
            if [ "$(docker exec mongo-it mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; then
              break
            fi
            sleep 2
          done
      - name: Integration tests on MongoDB + coverage
        run: |
          set -eo pipefail
          dotnet test apps/api-dotnet/MoviePicker.Api.IntegrationTests/MoviePicker.Api.IntegrationTests.csproj \
            -c Debug --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --settings apps/api-dotnet/coverlet.integration.runsettings \
            --results-directory ./coverage-mongo
        env:
          MONGODB_URI: ""
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
      # The Mongo adapters are excluded from the test-api job report: they only run on a real
      # database. Without this gate, the only layer that runs solely in production would be
      # measured nowhere.
      - name: Mongo adapters coverage gate
        run: node scripts/check-mongo-coverage.mjs coverage-mongo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-api-mongo
          path: coverage-mongo
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: 🎭 E2E Playwright (blocking)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests (web build + API stub + Playwright)
        run: pnpm run test:e2e:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-traces
          path: test-results
          # Playwright only writes test-results/ on failure/retry; empty on a green run is normal.
          if-no-files-found: ignore
          retention-days: 7

  e2e-mongo:
    # The only job running the full stack: real browser + API wired to a real MongoDB. The e2e job
    # runs on the in-memory database, test-api-mongo runs without a browser: without this one, the
    # combination that runs in production is reproduced nowhere before the deployment.
    name: 🎭 E2E critical path on real MongoDB (blocking)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Start MongoDB as a replica set (transactions)
        run: |
          set -eo pipefail
          docker run -d --name mongo-e2e -p 27017:27017 "$MONGO_IMAGE" --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            if docker exec mongo-e2e mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-e2e mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for _ in $(seq 1 30); do
            if [ "$(docker exec mongo-e2e mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; then
              break
            fi
            sleep 2
          done
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Critical path (web build + API on MongoDB + Playwright)
        run: pnpm run test:e2e:mongo
        env:
          # Dedicated database: the Development guard refuses the 'moviepicker' database.
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/moviepicker_e2e?directConnection=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-traces-mongo
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # The job ran everywhere except on workflow_dispatch, because deployments lived here and an
  # excluded sonar was the only way to replay a deployment by hand. Deployments moved to
  # `deploy.yml`, and the exclusion became a hole: `deploy.yml` consumes the *conclusion* of a CI
  # run, yet a skipped job does not fail a run. A manual run without Quality Gate therefore
  # concluded green and authorised a deployment Sonar had never seen.
  # `v*` branches are analysed too, as named Sonar branches (`sonar.branch.name`), so that the
  # Quality Gate is seen during the version rather than at its merge into master. Without that
  # parameter, an analysis pushed from a branch would overwrite master's, which SonarCloud takes as
  # the main branch by default.
  sonar:
    name: 📊 SonarCloud (analysis + coverage, blocking Quality Gate)
    needs: [changes, test-web, test-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      always() &&
      github.event.pull_request.head.repo.fork != true &&
      github.actor != 'dependabot[bot]' &&
      (needs.test-web.result == 'success' || needs.test-api.result == 'success')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: ./.github/actions/setup-dotnet-cache
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}
      - name: "Web coverage: download artifact (if test-web ran)"
        if: needs.test-web.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-web
          path: apps/web/coverage
      - name: "Web coverage: fallback (regenerate if test-web did not run)"
        if: needs.test-web.result != 'success'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:coverage --filter=web
      # Same logic as for the web app: the test-api job already produced this report, replaying it
      # here cost a minute on the critical path of the run. The OpenCover report carries absolute
      # paths, identical from one runner to another, so Sonar reads it without rewriting.
      - name: "API coverage: download artifact (if test-api ran)"
        if: needs.test-api.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-api-unit
          path: coverage-unit
      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner --version "$SONARSCANNER_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      # The `dotnet build` must stay between begin and end, that is where the Sonar Roslyn
      # analysers run. The tests only serve the coverage: they are replayed only when the test-api
      # artifact is missing.
      - name: SonarCloud analysis (begin + build + Quality Gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          API_COVERAGE_DOWNLOADED: ${{ needs.test-api.result == 'success' }}
          MONGODB_URI: ""
        run: |
          set -eo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          . ./configs/sonar-exclusions.sh
          VERSION="$(git describe --tags --always 2>/dev/null || echo 0.0.0)"
          REFARGS=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            REFARGS=(/d:sonar.pullrequest.key="$PR_NUMBER" /d:sonar.pullrequest.branch="$PR_HEAD" /d:sonar.pullrequest.base="$PR_BASE")
          elif [ "$REF_NAME" != "master" ]; then
            REFARGS=(/d:sonar.branch.name="$REF_NAME")
          fi
          dotnet sonarscanner begin \
            /k:"Affy657_Movie-Picker" \
            /o:"affy657" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.scanner.skipJreProvisioning=true \
            /d:sonar.projectBaseDir="$GITHUB_WORKSPACE" \
            /d:sonar.architecture.enable=false \
            /v:"$VERSION" \
            /d:sonar.exclusions="$EXCL" \
            /d:sonar.coverage.exclusions="$COV_EXCL" \
            /d:sonar.cpd.exclusions="$CPD" \
            /d:sonar.javascript.lcov.reportPaths="apps/web/coverage/lcov.info" \
            /d:sonar.cs.opencover.reportsPaths="coverage-unit/**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            "${REFARGS[@]}"
          dotnet build apps/api-dotnet/MoviePicker.slnx -c Debug
          if [ "$API_COVERAGE_DOWNLOADED" != "true" ]; then
            dotnet test apps/api-dotnet/MoviePicker.Api.Tests/MoviePicker.Api.Tests.csproj -c Debug --no-build \
              --collect:"XPlat Code Coverage" \
              --settings apps/api-dotnet/coverlet.runsettings \
              --results-directory coverage-unit
          fi
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      # SonarCloud files a pull request analysis under `pullRequest=<number>`, not under its head
      # branch: queried by branch, the diagnostic answered "No projectStatus" on every red PR.
      - name: "Quality Gate: failing conditions detail"
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eo pipefail
          cat > qg-report.mjs <<'NODESCRIPT'
          const token = process.env.SONAR_TOKEN ?? "";
          const branch = process.env.BRANCH_NAME ?? "";
          const prNumber = process.env.PR_NUMBER ?? "";
          const scope = prNumber
            ? "&pullRequest=" + encodeURIComponent(prNumber)
            : "&branch=" + encodeURIComponent(branch);
          const url =
            "https://sonarcloud.io/api/qualitygates/project_status" +
            "?projectKey=Affy657_Movie-Picker" + scope;

          const auth = {
            Authorization: "Basic " + Buffer.from(token + ":").toString("base64"),
          };
          const response = await fetch(url, { headers: auth });
          const body = await response.text();

          let parsed;
          try {
            parsed = JSON.parse(body);
          } catch {
            console.log("Unreadable SonarCloud response: " + body.slice(0, 500));
            process.exit(0);
          }

          const project = parsed.projectStatus;
          if (!project) {
            console.log("No projectStatus: " + JSON.stringify(parsed).slice(0, 500));
            process.exit(0);
          }

          console.log("Quality Gate: " + project.status);

          const failing = (project.conditions || []).filter((c) => c.status !== "OK");
          if (failing.length === 0) {
            console.log("No failing condition: the failure is probably technical.");
            process.exit(0);
          }

          for (const c of failing) {
            console.log(
              "::error::" + c.metricKey + " = " + c.actualValue +
                " (threshold " + c.comparator + " " + c.errorThreshold + ")"
            );
          }

          if (!failing.some((c) => c.metricKey.includes("duplicated"))) process.exit(0);

          const treeUrl =
            "https://sonarcloud.io/api/measures/component_tree" +
            "?component=Affy657_Movie-Picker" + scope +
            "&metricKeys=new_duplicated_lines,duplicated_lines,duplicated_lines_density" +
            "&qualifiers=FIL&s=metric&metricSort=duplicated_lines&asc=false&ps=20";
          const treeResponse = await fetch(treeUrl, { headers: auth });
          const treeBody = await treeResponse.text();

          let tree;
          try {
            tree = JSON.parse(treeBody);
          } catch {
            console.log("Unreadable component_tree: " + treeBody.slice(0, 800));
            process.exit(0);
          }

          const readMeasure = (component, key) => {
            const m = (component.measures || []).find((x) => x.metricKey === key);
            if (!m) return null;
            return m.value ?? m.period?.value ?? m.periods?.[0]?.value ?? null;
          };

          const rows = (tree.components || [])
            .map((component) => ({
              path: component.path,
              fresh: readMeasure(component, "new_duplicated_lines"),
              total: readMeasure(component, "duplicated_lines"),
              density: readMeasure(component, "duplicated_lines_density"),
            }))
            .filter((r) => r.fresh !== null || r.total !== null);

          if (rows.length === 0) {
            console.log("No per-file measure. Raw response:");
            console.log(treeBody.slice(0, 1500));
            process.exit(0);
          }

          console.log("Most duplicated files (new / total / density):");
          for (const r of rows) {
            console.log(
              "  " + (r.fresh ?? "-") + " / " + (r.total ?? "-") + " / " +
                (r.density ?? "-") + "%  " + r.path
            );
          }
          NODESCRIPT
          node qg-report.mjs
