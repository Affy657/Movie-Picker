# CI/CD Movie Picker — lint, tests web + API, couverture, déploiements (E2E Playwright : local uniquement)
# Branche par défaut : **master** (CI/CD sur cette branche uniquement — voir docs/mvp/04-deploy-cicd.md).

name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "10.0.x"
  GCP_REGION: europe-west1
  GCP_ARTIFACT_REPO: movie-picker
  CLOUD_RUN_SERVICE_NAME: movie-picker-api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:eslint
      - run: pnpm run format:check
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore API .NET
        run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      - name: dotnet format (vérification, roadmap § 31)
        run: dotnet format apps/api-dotnet/MoviePicker.slnx --verify-no-changes --verbosity minimal
      - name: Build API .NET (warnings → errors)
        run: dotnet build apps/api-dotnet/MoviePicker.slnx -c Release --no-restore -warnaserror
      - name: Export OpenAPI (artefact, roadmap § 32)
        env:
          SKIP_OPENAPI_BUILD: '1'
        run: node scripts/export-openapi.cjs
      - uses: actions/upload-artifact@v5
        with:
          name: openapi-v1
          path: artifacts/openapi-v1.json
          if-no-files-found: error
      - name: Audit dépendances (échoue si high/critical)
        run: pnpm audit --audit-level=high

  test-web:
    name: Tests front + couverture
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test --filter=web
      - run: pnpm run test:coverage --filter=web
      - uses: actions/upload-artifact@v5
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: warn

  test-api:
    name: Tests API .NET + couverture
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Tests unitaires + couverture
        run: |
          dotnet test apps/api-dotnet/MoviePicker.Api.Tests/MoviePicker.Api.Tests.csproj -c Debug \
            --collect:"XPlat Code Coverage" --results-directory ./coverage-unit
        env:
          MONGODB_URI: ""
      - name: Tests intégration
        run: dotnet test apps/api-dotnet/MoviePicker.Api.IntegrationTests/MoviePicker.Api.IntegrationTests.csproj -c Debug --verbosity normal
        env:
          MONGODB_URI: ""
      - uses: actions/upload-artifact@v5
        with:
          name: coverage-api-unit
          path: coverage-unit
          if-no-files-found: warn

  lighthouse:
    name: Lighthouse front (rapport, non bloquant)
    needs: test-web
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: browser-actions/setup-chrome@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lighthouse
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-reports
          path: artifacts/lighthouse
          if-no-files-found: warn

  docker-api:
    name: Docker API → Artifact Registry
    runs-on: ubuntu-latest
    needs: [test-web, test-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - run: docker build -f apps/api-dotnet/MoviePicker.Api/Dockerfile -t movie-picker-api apps/api-dotnet/MoviePicker.Api
      - run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/api:${{ github.sha }}"
          IMAGE_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/api:latest"
          docker tag movie-picker-api "$IMAGE"
          docker tag movie-picker-api "$IMAGE_LATEST"
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

  deploy-api:
    name: Deploy API → Cloud Run
    runs-on: ubuntu-latest
    needs: docker-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Activer l’API Secret Manager (obligatoire pour --set-secrets ; idempotent)
        run: gcloud services enable secretmanager.googleapis.com --project="${{ secrets.GCP_PROJECT_ID }}"
      - name: Deploy Cloud Run (secrets GCP + CORS)
        env:
          # Variables (recommandé) ou Secret de secours si tu as tout mis dans Secrets
          ALLOWED_ORIGINS_VARS: ${{ vars.ALLOWED_ORIGINS }}
          ALLOWED_ORIGINS_SECRET: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          CORS="${ALLOWED_ORIGINS_VARS:-$ALLOWED_ORIGINS_SECRET}"
          if [ -z "$CORS" ]; then
            echo "::error::ALLOWED_ORIGINS est vide. Définis-la au choix :"
            echo "::error::  • GitHub → Settings → Secrets and variables → Actions → Variables → New repository variable : ALLOWED_ORIGINS = https://TON_ID.cloudfront.net (sans slash final ; plusieurs origines : virgules)"
            echo "::error::  • ou Secret du même nom (ALLOWED_ORIGINS) si tu préfères."
            exit 1
          fi
          # --set-env-vars dict parsing treats ':' and ',' specially; ^##^ sets an alternate delimiter (gcloud topic escaping).
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/api:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets "MONGODB_URI=MONGODB_URI:latest,TMDB_API_KEY=TMDB_API_KEY:latest,AUTH_DATAPROTECTION_KEYRING=AUTH_DATAPROTECTION_KEYRING:latest" \
            --set-env-vars "^##^ALLOWED_ORIGINS=$CORS"

  deploy-front:
    name: Deploy Front → S3 & CloudFront
    runs-on: ubuntu-latest
    needs: [test-web, test-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build Vite : un seul bundle JS + CSS hashés dans apps/web/dist (imports @import CSS inclus).
      - run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL (secret) est vide."
            exit 1
          fi
          if echo "$VITE_API_URL" | grep -qE 'cloudfront\.net|amazonaws'; then
            echo "::error::VITE_API_URL doit être l'URL de l'API (Cloud Run)."
            exit 1
          fi
          pnpm --filter web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - run: |
          aws s3 sync apps/web/dist/ s3://${{ secrets.AWS_S3_BUCKET }}/
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html --metadata-directive REPLACE --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/assets/index.js s3://${{ secrets.AWS_S3_BUCKET }}/assets/index.js --metadata-directive REPLACE --cache-control "no-cache, must-revalidate" --content-type "application/javascript"
      - if: vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "$INV_ID"
