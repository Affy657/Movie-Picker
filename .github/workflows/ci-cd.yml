# CI/CD Movie Picker – build, tests (lint), déploiement API .NET (GCP) et front (AWS)
# Déclenché sur push vers main (déploiements) et sur tout push (build/lint).
# Secrets à configurer : voir docs/mvp/deploy-cicd.md

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "10.0.x"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GCP_REGION: europe-west1
  GCP_ARTIFACT_REPO: movie-picker
  CLOUD_RUN_SERVICE_NAME: movie-picker-api

jobs:
  # --- Build et vérifications (à chaque push / PR) ---
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (TypeScript)
        run: pnpm run lint

      - name: Lint (ESLint)
        run: pnpm run lint:eslint

      - name: Format (Prettier)
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build web
        run: pnpm run build --filter=web

      - name: Build API .NET
        run: dotnet publish apps/api-dotnet/MoviePicker.Api/MoviePicker.Api.csproj -c Release

  # --- Build image Docker API et push Artifact Registry (GCP) ---
  docker-api:
    name: Docker API → Artifact Registry
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image (API .NET)
        run: |
          docker build -f apps/api-dotnet/MoviePicker.Api/Dockerfile -t movie-picker-api apps/api-dotnet/MoviePicker.Api

      - name: Tag and push to Artifact Registry
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/api:${{ github.sha }}"
          IMAGE_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/api:latest"
          docker tag movie-picker-api "$IMAGE"
          docker tag movie-picker-api "$IMAGE_LATEST"
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

  # --- Déploiement API sur Cloud Run ---
  deploy-api:
    name: Deploy API → Cloud Run
    runs-on: ubuntu-latest
    needs: docker-api
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/api:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "MONGODB_URI=${{ secrets.MONGODB_URI }},TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}"

  # --- Build front et déploiement S3 + CloudFront ---
  deploy-front:
    name: Deploy Front → S3 & CloudFront
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (with API URL for production)
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL (secret) est vide. Définissez l'URL Cloud Run (ex. https://xxx.run.app) dans Settings → Secrets."
            exit 1
          fi
          if echo "$VITE_API_URL" | grep -qE 'cloudfront\.net|amazonaws'; then
            echo "::error::VITE_API_URL ne doit pas être l'URL du site (CloudFront/S3) mais l'URL de l'API (Cloud Run)."
            exit 1
          fi
          pnpm --filter web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Sync build to S3
        run: |
          aws s3 sync apps/web/dist/ s3://${{ secrets.AWS_S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        if: vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
