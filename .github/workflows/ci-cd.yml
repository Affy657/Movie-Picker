# CI/CD Movie Picker — lint, tests parallèles (web, API, E2E), couverture, déploiements

name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "10.0.x"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GCP_REGION: europe-west1
  GCP_ARTIFACT_REPO: movie-picker
  CLOUD_RUN_SERVICE_NAME: movie-picker-api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:eslint
      - run: pnpm run format:check

  test-web:
    name: Tests front + couverture
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test --filter=web
      - run: pnpm run test:coverage --filter=web
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: warn

  test-api:
    name: Tests API .NET + couverture
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Tests unitaires + couverture
        run: |
          dotnet test apps/api-dotnet/MoviePicker.Api.Tests/MoviePicker.Api.Tests.csproj -c Debug \
            --collect:"XPlat Code Coverage" --results-directory ./coverage-unit
        env:
          MONGODB_URI: ""
      - name: Tests intégration
        run: dotnet test apps/api-dotnet/MoviePicker.Api.IntegrationTests/MoviePicker.Api.IntegrationTests.csproj -c Debug --verbosity normal
        env:
          MONGODB_URI: ""
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-api-unit
          path: coverage-unit
          if-no-files-found: warn

  test-e2e:
    name: E2E Playwright
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: dotnet build apps/api-dotnet/MoviePicker.Api/MoviePicker.Api.csproj -c Release
      - run: VITE_API_URL=http://127.0.0.1:5010 pnpm --filter web build
      - run: pnpm exec playwright install chromium --with-deps
      - name: E2E (API en arrière-plan + Playwright)
        run: |
          # --no-launch-profile : sinon launchSettings.json force le port 4000 et ignore ASPNETCORE_URLS
          E2E_STUB_TMDB=1 MONGODB_URI= ASPNETCORE_URLS=http://127.0.0.1:5010 dotnet run --project apps/api-dotnet/MoviePicker.Api/MoviePicker.Api.csproj --no-build -c Release --no-launch-profile &
          ready=0
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:5010/health && ready=1 && break
            sleep 2
          done
          test "$ready" = 1 || (echo "::error::API introuvable sur :5010 (vérifiez --no-launch-profile)"; exit 1)
          CI=1 pnpm run test:e2e

  docker-api:
    name: Docker API → Artifact Registry
    runs-on: ubuntu-latest
    needs: [test-web, test-api, test-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - run: docker build -f apps/api-dotnet/MoviePicker.Api/Dockerfile -t movie-picker-api apps/api-dotnet/MoviePicker.Api
      - run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/api:${{ github.sha }}"
          IMAGE_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/api:latest"
          docker tag movie-picker-api "$IMAGE"
          docker tag movie-picker-api "$IMAGE_LATEST"
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

  deploy-api:
    name: Deploy API → Cloud Run
    runs-on: ubuntu-latest
    needs: docker-api
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPO }}/api:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "MONGODB_URI=${{ secrets.MONGODB_URI }},TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}"

  deploy-front:
    name: Deploy Front → S3 & CloudFront
    runs-on: ubuntu-latest
    needs: [test-web, test-api, test-e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL (secret) est vide."
            exit 1
          fi
          if echo "$VITE_API_URL" | grep -qE 'cloudfront\.net|amazonaws'; then
            echo "::error::VITE_API_URL doit être l'URL de l'API (Cloud Run)."
            exit 1
          fi
          pnpm --filter web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - run: |
          aws s3 sync apps/web/dist/ s3://${{ secrets.AWS_S3_BUCKET }}/
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html --metadata-directive REPLACE --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"
          aws s3 cp s3://${{ secrets.AWS_S3_BUCKET }}/assets/index.js s3://${{ secrets.AWS_S3_BUCKET }}/assets/index.js --metadata-directive REPLACE --cache-control "no-cache, must-revalidate" --content-type "application/javascript"
      - if: vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "$INV_ID"
