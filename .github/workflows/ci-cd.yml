# CI/CD Movie Picker — monorepo (front Vite/React → S3+CloudFront ; API .NET → Cloud Run).
#
# Path-filtering : le job "changes" (dorny/paths-filter) calcule 2 sorties web/api ; chaque job
# ne tourne que si sa lane est impactée (skip sinon). workflow_dispatch force les 2 lanes.
#   - Lane web : lint-web, test-web, lighthouse, deploy-front.
#   - Lane api : lint-api, test-api, docker-api, deploy-api.
#   - Transverses : gitleaks (toujours), audit npm/NuGet, sonar (analyse globale + Quality Gate bloquant).
#   - E2E Playwright : job CI bloquant (gate du déploiement) + exécution locale.
#
# Durcissement sécurité :
#   - Actions épinglées par SHA de commit (anti supply-chain) ; le commentaire # vX permet à Dependabot de proposer les MAJ.
#   - Images Docker (base .NET + gitleaks) épinglées par digest sha256.
#   - permissions least-privilege (deny par défaut) ; checkout avec persist-credentials: false.
#   - Secrets passés via env: (jamais interpolés directement dans un bloc run:).
#   - Quality Gate SonarCloud bloquant — un QG rouge fait échouer le job et bloque le déploiement.
#   - concurrency: group cd-<ref> — cancel-in-progress sur PR / false sur master.
#   - timeout-minutes sur chaque job ; caches NuGet / Turbo / Trivy.
#   - docker-api : scan Trivy (CRITICAL bloquant ; HIGH bloquant si fix dispo) + cache de layers GHA.
#   - Déploiements : environment "production" (historique GitHub) + smoke test post-deploy (/health, CloudFront).

name: CI/CD

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "10.0.x"
  GCP_REGION: europe-west1
  GCP_ARTIFACT_REPO: movie-picker
  CLOUD_RUN_SERVICE_NAME: movie-picker-api
  ACTIONLINT_VERSION: "1.7.7"
  ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
  ZIZMOR_VERSION: "1.30.0"

jobs:
  changes:
    name: Détection des changements (path-filtering)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
      api: ${{ steps.filter.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      # fetch-depth: 0 requis : sur push, paths-filter diffe contre le commit précédent
      # via git ; sans historique complet il devrait fetch, ce qui échoue avec
      # persist-credentials: false (pas de token). L'historique complet évite le fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.ref == 'refs/heads/master' && '' || 'master' }}
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'eslint.config.mjs'
              - 'prettier.config.cjs'
              - 'playwright.config.ts'
              - 'configs/**'
              - 'e2e/**'
              - 'scripts/**'
              - '.github/workflows/ci-cd.yml'
            api:
              - 'apps/api-dotnet/**'
              - 'scripts/**'
              - '.github/workflows/ci-cd.yml'

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan working tree
        run: |
          docker run --rm -v "${PWD}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            dir --no-banner --redact --verbose --exit-code 1 /repo

  # ci-cd.yml fait ~900 lignes de YAML et de bash que ni check:architecture, ni ESLint, ni
  # Prettier ne regardent : la chaîne qui garde le code n'était elle-même gardée par rien.
  # Inconditionnel comme gitleaks — une porte qu'un path-filter peut sauter ne garde rien.
  #   - actionlint : erreurs de syntaxe, expressions ${{ }} invalides, permissions incohérentes.
  #     Il délègue aux blocs `run:` à shellcheck, préinstallé sur les runners GitHub.
  #   - zizmor : audit sécurité des workflows. Seuil `medium` — le dépôt est à 0 medium et 0 high,
  #     donc la porte est verte aujourd'hui et n'attrape que du sérieux (injection depuis un
  #     contexte non fiable, secrets exposés). Descendre à `low` demanderait de traiter 13
  #     constats cosmétiques. `--offline` pour que la porte ne dépende pas de l'API GitHub.
  lint-workflows:
    name: Lint workflows (actionlint + zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (+ shellcheck sur les blocs run)
        run: |
          set -eo pipefail
          curl -sSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor (audit sécurité, seuil medium)
        run: |
          set -eo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet "zizmor==${ZIZMOR_VERSION}"
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --offline --no-progress --min-severity medium --format plain .github/workflows/

  lint-web:
    name: Lint front (tsc + eslint + prettier)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-lintweb-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lintweb-${{ runner.os }}-
      - run: pnpm run check:architecture
      - run: pnpm run lint
      - run: pnpm run lint:eslint
      - run: pnpm run format:check

  lint-api:
    name: Lint API .NET (format + build + OpenAPI)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Restore API .NET
        run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      - name: dotnet format (vérification, roadmap § 31)
        run: dotnet format apps/api-dotnet/MoviePicker.slnx --verify-no-changes --verbosity minimal
      - name: Build API .NET (warnings → errors)
        run: dotnet build apps/api-dotnet/MoviePicker.slnx -c Release --no-restore -warnaserror
      - name: Export OpenAPI (artefact, roadmap § 32)
        env:
          SKIP_OPENAPI_BUILD: '1'
        run: node scripts/export-openapi.cjs
      - name: Types front alignés sur le contrat OpenAPI
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/check-openapi-types.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-v1
          path: artifacts/openapi-v1.json
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Audit dépendances (npm + NuGet)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit npm (Trivy — pnpm audit indisponible, endpoint npm retiré le 2026-07-15, cf. pnpm/pnpm#11265)
        if: needs.changes.outputs.web == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: needs.changes.outputs.api == 'true'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.api == 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api-dotnet/**/*.csproj', 'apps/api-dotnet/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore API .NET (pour audit NuGet)
        if: needs.changes.outputs.api == 'true'
        run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      - name: Audit NuGet — liste vulnérabilités (informatif)
        if: needs.changes.outputs.api == 'true'
        run: dotnet list apps/api-dotnet/MoviePicker.slnx package --vulnerable --include-transitive
      - name: Audit NuGet — échoue si High / Critical
        if: needs.changes.outputs.api == 'true'
        run: |
          set -o pipefail
          OUTPUT=$(dotnet list apps/api-dotnet/MoviePicker.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -Eq '\b(High|Critical)\b'; then
            echo "::error::Vulnérabilités NuGet High/Critical détectées. Mettre à jour ou suppress via <NuGetAuditSuppress> dans Directory.Build.props (documenter la raison)."
            exit 1
          fi

  test-web:
    name: Tests front + couverture
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-testweb-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-testweb-${{ runner.os }}-
      - run: pnpm run test:coverage --filter=web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: warn
          retention-days: 7

  test-api:
    name: Tests API .NET + couverture
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Tests unitaires + couverture
        run: |
          dotnet test apps/api-dotnet/MoviePicker.Api.Tests/MoviePicker.Api.Tests.csproj -c Debug \
            --collect:"XPlat Code Coverage" \
            --settings apps/api-dotnet/coverlet.runsettings \
            --results-directory ./coverage-unit
        env:
          MONGODB_URI: ""
      - name: Gate couverture back (lignes >= 80%)
        run: |
          set -eo pipefail
          report="$(find ./coverage-unit -name coverage.opencover.xml | head -1)"
          if [ -z "$report" ]; then
            echo "::error::Rapport de couverture OpenCover introuvable"
            exit 1
          fi
          cov="$(grep -m1 -o 'sequenceCoverage="[0-9.]*"' "$report" | grep -o '[0-9.]*')"
          echo "Couverture lignes back : ${cov}% (seuil 80%)"
          if awk -v c="$cov" 'BEGIN { exit !(c + 0 >= 80) }'; then
            echo "OK : couverture back suffisante"
          else
            echo "::error::Couverture back ${cov}% < 80% requis"
            exit 1
          fi
      - name: Tests intégration
        run: dotnet test apps/api-dotnet/MoviePicker.Api.IntegrationTests/MoviePicker.Api.IntegrationTests.csproj -c Debug --verbosity normal
        env:
          MONGODB_URI: ""
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-api-unit
          path: coverage-unit
          if-no-files-found: warn
          retention-days: 7

  test-api-mongo:
    name: Tests API .NET sur MongoDB réel
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Démarrer MongoDB en replica set (transactions)
        run: |
          set -eo pipefail
          docker run -d --name mongo-it -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            if docker exec mongo-it mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-it mongosh --quiet --eval             'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for _ in $(seq 1 30); do
            if [ "$(docker exec mongo-it mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; then
              break
            fi
            sleep 2
          done
      - name: Tests intégration sur MongoDB
        run: dotnet test apps/api-dotnet/MoviePicker.Api.IntegrationTests/MoviePicker.Api.IntegrationTests.csproj -c Debug --verbosity normal
        env:
          MONGODB_URI: ""
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true

  lighthouse:
    name: Lighthouse front (seuils bloquants)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
      - run: pnpm run lighthouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: lighthouse-reports
          path: artifacts/lighthouse
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: E2E Playwright (bloquant)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Installer le navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests E2E (build front + API stub + Playwright)
        run: pnpm run test:e2e:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-traces
          path: test-results
          # Playwright n'écrit test-results/ qu'en cas d'échec/retry ; vide sur run vert = normal.
          if-no-files-found: ignore
          retention-days: 7

  sonar:
    name: SonarCloud (analyse + couverture ; QG bloquant)
    needs: [changes, test-web, test-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      always() && github.event_name != 'workflow_dispatch' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') &&
      (needs.test-web.result == 'success' || needs.test-api.result == 'success')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api-dotnet/**/*.csproj', 'apps/api-dotnet/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Couverture front — download artefact (si test-web a tourné)
        if: needs.test-web.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-web
          path: apps/web/coverage
      - name: Couverture front — fallback (régénère si test-web non exécuté)
        if: needs.test-web.result != 'success'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:coverage --filter=web
      - name: Installer SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 11.2.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Analyse SonarCloud (begin + build + tests + Quality Gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          MONGODB_URI: ""
        run: |
          set -eo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN manquant (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          . ./configs/sonar-exclusions.sh
          VERSION="$(git describe --tags --always 2>/dev/null || echo 0.0.0)"
          PRARGS=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PRARGS=(/d:sonar.pullrequest.key="$PR_NUMBER" /d:sonar.pullrequest.branch="$PR_HEAD" /d:sonar.pullrequest.base="$PR_BASE")
          fi
          dotnet sonarscanner begin \
            /k:"Affy657_Movie-Picker" \
            /o:"affy657" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.scanner.skipJreProvisioning=true \
            /d:sonar.projectBaseDir="$GITHUB_WORKSPACE" \
            /d:sonar.architecture.enable=false \
            /v:"$VERSION" \
            /d:sonar.exclusions="$EXCL" \
            /d:sonar.coverage.exclusions="$COV_EXCL" \
            /d:sonar.cpd.exclusions="$CPD" \
            /d:sonar.javascript.lcov.reportPaths="apps/web/coverage/lcov.info" \
            /d:sonar.cs.opencover.reportsPaths="apps/api-dotnet/**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            "${PRARGS[@]}"
          dotnet build apps/api-dotnet/MoviePicker.slnx -c Debug
          dotnet test apps/api-dotnet/MoviePicker.Api.Tests/MoviePicker.Api.Tests.csproj -c Debug --no-build \
            --collect:"XPlat Code Coverage" \
            --settings apps/api-dotnet/coverlet.runsettings \
            --results-directory apps/api-dotnet/MoviePicker.Api.Tests/TestResults
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      - name: "Quality Gate — detail des conditions en echec"
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eo pipefail
          cat > qg-report.mjs <<'NODESCRIPT'
          const token = process.env.SONAR_TOKEN ?? "";
          const branch = process.env.BRANCH_NAME ?? "";
          const url =
            "https://sonarcloud.io/api/qualitygates/project_status" +
            "?projectKey=Affy657_Movie-Picker&branch=" + encodeURIComponent(branch);

          const auth = {
            Authorization: "Basic " + Buffer.from(token + ":").toString("base64"),
          };
          const response = await fetch(url, { headers: auth });
          const body = await response.text();

          let parsed;
          try {
            parsed = JSON.parse(body);
          } catch {
            console.log("Reponse SonarCloud illisible : " + body.slice(0, 500));
            process.exit(0);
          }

          const project = parsed.projectStatus;
          if (!project) {
            console.log("Pas de projectStatus : " + JSON.stringify(parsed).slice(0, 500));
            process.exit(0);
          }

          console.log("Quality Gate : " + project.status);

          const failing = (project.conditions || []).filter((c) => c.status !== "OK");
          if (failing.length === 0) {
            console.log("Aucune condition en echec : echec probablement technique.");
            process.exit(0);
          }

          for (const c of failing) {
            console.log(
              "::error::" + c.metricKey + " = " + c.actualValue +
                " (seuil " + c.comparator + " " + c.errorThreshold + ")"
            );
          }

          if (!failing.some((c) => c.metricKey.includes("duplicated"))) process.exit(0);

          const treeUrl =
            "https://sonarcloud.io/api/measures/component_tree" +
            "?component=Affy657_Movie-Picker&branch=" + encodeURIComponent(branch) +
            "&metricKeys=new_duplicated_lines,duplicated_lines,duplicated_lines_density" +
            "&qualifiers=FIL&s=metric&metricSort=duplicated_lines&asc=false&ps=20";
          const treeResponse = await fetch(treeUrl, { headers: auth });
          const treeBody = await treeResponse.text();

          let tree;
          try {
            tree = JSON.parse(treeBody);
          } catch {
            console.log("component_tree illisible : " + treeBody.slice(0, 800));
            process.exit(0);
          }

          const readMeasure = (component, key) => {
            const m = (component.measures || []).find((x) => x.metricKey === key);
            if (!m) return null;
            return m.value ?? m.period?.value ?? m.periods?.[0]?.value ?? null;
          };

          const rows = (tree.components || [])
            .map((component) => ({
              path: component.path,
              neuf: readMeasure(component, "new_duplicated_lines"),
              total: readMeasure(component, "duplicated_lines"),
              densite: readMeasure(component, "duplicated_lines_density"),
            }))
            .filter((r) => r.neuf !== null || r.total !== null);

          if (rows.length === 0) {
            console.log("Aucune mesure par fichier. Reponse brute :");
            console.log(treeBody.slice(0, 1500));
            process.exit(0);
          }

          console.log("Fichiers les plus dupliques (neuf / total / densite) :");
          for (const r of rows) {
            console.log(
              "  " + (r.neuf ?? "-") + " / " + (r.total ?? "-") + " / " +
                (r.densite ?? "-") + "%  " + r.path
            );
          }
          NODESCRIPT
          node qg-report.mjs
  docker-api:
    name: Docker API → Artifact Registry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes, gitleaks, lint-api, test-api, test-api-mongo, audit]
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && needs.changes.outputs.api == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image API (buildx + cache GHA de layers)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/api-dotnet/MoviePicker.Api
          tags: movie-picker-api
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # § 25 — Scan CVE de l'image avant push. Politique :
      #   - bloque sur CRITICAL inconditionnellement
      #   - bloque sur HIGH **uniquement si un fix amont est disponible** (`ignore-unfixed: true`),
      #     pour éviter de geler le déploiement sur des CVE base-image sans patch publié.
      # Si un CVE bloque ici, soit on rebuild avec une base image plus récente, soit on
      # documente le risque (workaround / mitigation) et on suppress côté Trivy
      # (`.trivyignore` à la racine du contexte de build) avec une note de revue.
      - name: Scan image Docker (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: movie-picker-api
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          cache: true
      # Le digest est relevé après push et sert de cible au déploiement : un tag reste
      # réinscriptible, un digest désigne exactement les octets que Trivy vient de scanner.
      - name: Tag & push image
        id: push
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -eo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPO}/api:${GITHUB_SHA}"
          docker tag movie-picker-api "$IMAGE"
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d'@' -f2)"
          if ! printf '%s' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Digest introuvable après push (relevé : '$DIGEST')"
            exit 1
          fi
          echo "Image poussée : $IMAGE"
          echo "Digest : $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: SBOM de l'image (Trivy → CycloneDX, artefact)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: movie-picker-api
          format: cyclonedx
          output: sbom.cdx.json
          cache: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-api
          path: sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30

  deploy-api:
    name: Deploy API → Cloud Run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [docker-api, e2e, sonar]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' &&
      needs.docker-api.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.sonar.result == 'success'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Activer l’API Secret Manager (obligatoire pour --set-secrets ; idempotent)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: gcloud services enable secretmanager.googleapis.com --project="$GCP_PROJECT_ID"
      # Relevée avant le déploiement : c'est la cible du retour arrière automatique si la
      # nouvelle révision ne passe pas son smoke test. Vide au tout premier déploiement.
      - name: Mémoriser la révision servie avant déploiement
        id: previous
        run: |
          set -eo pipefail
          PREV="$(gcloud run services describe "$CLOUD_RUN_SERVICE_NAME" \
            --region "$GCP_REGION" --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)"
          echo "Révision servie avant déploiement : ${PREV:-<aucune>}"
          echo "revision=$PREV" >> "$GITHUB_OUTPUT"
      - name: Deploy Cloud Run (secrets GCP + CORS)
        env:
          # Variables (recommandé) ou Secret de secours si tu as tout mis dans Secrets
          ALLOWED_ORIGINS_VARS: ${{ vars.ALLOWED_ORIGINS }}
          ALLOWED_ORIGINS_SECRET: ${{ secrets.ALLOWED_ORIGINS }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE_DIGEST: ${{ needs.docker-api.outputs.image_digest }}
        run: |
          CORS="${ALLOWED_ORIGINS_VARS:-$ALLOWED_ORIGINS_SECRET}"
          if [ -z "$CORS" ]; then
            echo "::error::ALLOWED_ORIGINS est vide. Définis-la au choix :"
            echo "::error::  • GitHub → Settings → Secrets and variables → Actions → Variables → New repository variable : ALLOWED_ORIGINS = https://TON_ID.cloudfront.net (sans slash final ; plusieurs origines : virgules)"
            echo "::error::  • ou Secret du même nom (ALLOWED_ORIGINS) si tu préfères."
            exit 1
          fi
          # --set-env-vars dict parsing treats ':' and ',' specially; ^##^ sets an alternate delimiter (gcloud topic escaping).
          if ! printf '%s' "$IMAGE_DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Digest d'image absent ou invalide ('$IMAGE_DIGEST') : le job docker-api ne l'a pas transmis."
            exit 1
          fi
          gcloud run deploy "$CLOUD_RUN_SERVICE_NAME" \
            --image "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPO}/api@${IMAGE_DIGEST}" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --cpu-boost \
            --set-secrets "MONGODB_URI=MONGODB_URI:latest,TMDB_API_KEY=TMDB_API_KEY:latest,AUTH_DATAPROTECTION_KEYRING=AUTH_DATAPROTECTION_KEYRING:latest,VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY:latest,VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest,SENTRY_DSN=SENTRY_DSN:latest,RESEND_API_KEY=RESEND_API_KEY:latest,KOFI_WEBHOOK_TOKEN=KOFI_WEBHOOK_TOKEN:latest,OAUTH_GOOGLE_CLIENT_ID=OAUTH_GOOGLE_CLIENT_ID:latest,OAUTH_GOOGLE_CLIENT_SECRET=OAUTH_GOOGLE_CLIENT_SECRET:latest,OAUTH_GITHUB_CLIENT_ID=OAUTH_GITHUB_CLIENT_ID:latest,OAUTH_GITHUB_CLIENT_SECRET=OAUTH_GITHUB_CLIENT_SECRET:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest" \
            --set-env-vars "^##^ALLOWED_ORIGINS=$CORS##SENTRY_ENVIRONMENT=production##SENTRY_RELEASE=${{ github.sha }}##EMAIL_PROVIDER=resend"
      - name: Smoke test API (GET /health puis /health/ready)
        id: smoke_run
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -eo pipefail
          URL="$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE_NAME }} --region ${{ env.GCP_REGION }} --format='value(status.url)')"
          echo "Service URL : $URL"
          BODY="$(curl -sS --fail --retry 5 --retry-all-errors --retry-delay 5 "$URL/health")"
          echo "Réponse /health : $BODY"
          echo "$BODY" | grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' || {
            echo "::error::/health ne renvoie pas status=ok"
            exit 1
          }
          READY="$(curl -sS --fail --retry 5 --retry-all-errors --retry-delay 5 "$URL/health/ready")"
          echo "Réponse /health/ready : $READY"
          echo "$READY" | grep -qE '"status"[[:space:]]*:[[:space:]]*"ready"' || {
            echo "::error::/health/ready ne renvoie pas status=ready (dépendance indisponible)"
            exit 1
          }
          echo "$READY" | grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' || {
            echo "::error::/health/ready signale MongoDB comme non joignable"
            exit 1
          }
      # Jusqu'ici un smoke test rouge laissait la mauvaise révision en production en attendant
      # qu'un humain lance rollback.yml. Le trafic repart vers la révision précédente sans attendre.
      # Le job reste rouge : le retour arrière répare la prod, il ne masque pas l'échec.
      - name: Retour arrière automatique (révision précédente)
        if: failure() && steps.smoke_run.outcome == 'failure' && steps.previous.outputs.revision != ''
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
        run: |
          set -eo pipefail
          echo "::warning::Smoke test en échec — bascule du trafic vers $PREVIOUS_REVISION"
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE_NAME" \
            --region "$GCP_REGION" \
            --to-revisions "$PREVIOUS_REVISION=100"
          URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE_NAME" --region "$GCP_REGION" --format='value(status.url)')"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 "$URL/health")"
          echo "Après retour arrière, GET /health -> $code"
          test "$code" = "200"
      # Le smoke test précédent interroge l'URL Cloud Run : il ne dit rien du domaine public, dont
      # le DNS, le certificat ou le mapping peuvent être cassés alors que la révision va bien.
      # Un échec ici ne déclenche donc pas de retour arrière — la révision n'est pas en cause.
      - name: Smoke test API (domaine public)
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'https://api.movie-picker.fr' }}
        run: |
          set -eo pipefail
          echo "Domaine public : $PUBLIC_API_URL"
          BODY="$(curl -sS --fail --retry 5 --retry-all-errors --retry-delay 5 "$PUBLIC_API_URL/health")"
          echo "Réponse /health : $BODY"
          echo "$BODY" | grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"' || {
            echo "::error::$PUBLIC_API_URL/health ne renvoie pas status=ok — DNS, certificat ou mapping de domaine"
            exit 1
          }
      - name: Enregistrer le déploiement Sentry (API)
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN absent — skip"
            exit 0
          fi
          curl -sSfL "https://github.com/getsentry/sentry-cli/releases/download/2.58.6/sentry-cli-Linux-x86_64" -o sentry-cli
          chmod +x sentry-cli
          extra=()
          if [ -n "$SENTRY_URL" ]; then extra+=(--url "$SENTRY_URL"); fi
          ./sentry-cli "${extra[@]}" releases new "$SENTRY_RELEASE" || true
          ./sentry-cli "${extra[@]}" deploys new --release "$SENTRY_RELEASE" -e production -n "api-${{ github.sha }}"

  deploy-front:
    name: Deploy Front → S3 & CloudFront
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes, gitleaks, lint-web, test-web, audit, lighthouse, e2e, sonar]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' &&
      needs.changes.outputs.web == 'true' &&
      needs.changes.result == 'success' &&
      needs.gitleaks.result == 'success' &&
      needs.lint-web.result == 'success' &&
      needs.test-web.result == 'success' &&
      needs.audit.result == 'success' &&
      needs.lighthouse.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.sonar.result == 'success'
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::VITE_API_URL (secret) est vide."
            exit 1
          fi
          if echo "$VITE_API_URL" | grep -qE 'cloudfront\.net|amazonaws'; then
            echo "::error::VITE_API_URL doit être l'URL de l'API (Cloud Run)."
            exit 1
          fi
          pnpm --filter web build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_RELEASE: ${{ github.sha }}
      - name: "Sitemap dynamique (profils publics via l'API)"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: node apps/web/scripts/generate-sitemap.mjs
      # Le front n'a aucun retour arrière : `aws s3 sync` écrase, et le build précédent
      # n'existe plus nulle part (cf. l'avertissement en tête de rollback.yml). Archiver le
      # dist rend un retour arrière possible sans rejouer toute la chaîne de portes, et
      # l'archive reste valable quel que soit l'hébergement cible. Les source maps sont
      # exclues : elles sont déjà envoyées à Sentry et n'ont pas à traîner en artefact.
      - name: Archiver le build front (rend un retour arrière possible)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: front-dist-${{ github.sha }}
          path: |
            apps/web/dist
            !apps/web/dist/**/*.map
          if-no-files-found: error
          retention-days: 30
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - name: "S3 — étape 1 : assets hachés (hors entry-points)"
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 sync apps/web/dist/ "s3://$AWS_S3_BUCKET/" \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "manifest.webmanifest" \
            --exclude "sitemap.xml" \
            --exclude "*.map" \
            --cache-control "public, max-age=31536000, immutable"
      - name: "S3 — étape 2 : SW, manifest (no-cache)"
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 cp apps/web/dist/sw.js "s3://$AWS_S3_BUCKET/sw.js" \
            --cache-control "no-cache, no-store, must-revalidate" --content-type "application/javascript"
          aws s3 cp apps/web/dist/manifest.webmanifest "s3://$AWS_S3_BUCKET/manifest.webmanifest" \
            --cache-control "no-cache, must-revalidate" --content-type "application/manifest+json"
      - name: "S3 — sitemap.xml (cache court, application/xml)"
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 cp apps/web/dist/sitemap.xml "s3://$AWS_S3_BUCKET/sitemap.xml" \
            --cache-control "public, max-age=3600, must-revalidate" --content-type "application/xml; charset=utf-8"
      - name: "S3 — étape 3 : index.html en dernier (point d'entrée)"
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 cp apps/web/dist/index.html "s3://$AWS_S3_BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"
      - name: Invalidation CloudFront
        if: vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "$INV_ID"
      - name: Smoke test front (CloudFront)
        if: vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          DOMAIN="$(aws cloudfront get-distribution --id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --query 'Distribution.DomainName' --output text)"
          echo "CloudFront domain : $DOMAIN"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 "https://$DOMAIN/")"
          echo "GET / -> $code"
          test "$code" = "200"
      # Le smoke test précédent interroge le domaine CloudFront : il ne dit rien du domaine
      # public servi aux utilisateurs, dont le DNS, le certificat ou l'alias peuvent être
      # cassés alors que la distribution répond très bien.
      - name: Smoke test front (domaine public)
        env:
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL || 'https://web.movie-picker.fr' }}
        run: |
          set -eo pipefail
          echo "Domaine public : $PUBLIC_WEB_URL"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 "$PUBLIC_WEB_URL/")"
          echo "GET $PUBLIC_WEB_URL/ -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::$PUBLIC_WEB_URL ne répond pas 200 (DNS, certificat ou alias CloudFront)"
            exit 1
          fi
      - name: Enregistrer le déploiement Sentry (front)
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN absent — skip"
            exit 0
          fi
          extra=()
          if [ -n "$SENTRY_URL" ]; then extra+=(--url "$SENTRY_URL"); fi
          pnpm --filter web exec sentry-cli -- "${extra[@]}" releases new "$SENTRY_RELEASE" || true
          pnpm --filter web exec sentry-cli -- "${extra[@]}" deploys new --release "$SENTRY_RELEASE" -e production -n "front-${{ github.sha }}"

  deploy-guard:
    name: Garde-fou déploiement (master)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, deploy-api, deploy-front]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - name: Vérifier qu'un périmètre modifié a bien été déployé
        env:
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          FRONT_RESULT: ${{ needs.deploy-front.result }}
          API_RESULT: ${{ needs.deploy-api.result }}
        run: |
          echo "front : changé=$WEB_CHANGED déploiement=$FRONT_RESULT"
          echo "api   : changé=$API_CHANGED déploiement=$API_RESULT"
          fail=0
          if [ "$WEB_CHANGED" = "true" ] && [ "$FRONT_RESULT" != "success" ]; then
            echo "::error::Le front a changé mais Deploy Front est '$FRONT_RESULT' : la production n'est pas à jour."
            fail=1
          fi
          if [ "$API_CHANGED" = "true" ] && [ "$API_RESULT" != "success" ]; then
            echo "::error::L'API a changé mais Deploy API est '$API_RESULT' : la production n'est pas à jour."
            fail=1
          fi
          if [ "$fail" = "0" ]; then
            echo "Déploiements cohérents avec le périmètre modifié."
          fi
          exit "$fail"
