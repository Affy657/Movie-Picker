# Movie Picker CI: monorepo (Vite/React web app, .NET API). **This workflow deploys nothing.**
#
# Deployment is a manual gesture, in `.github/workflows/deploy.yml`: a push to master runs the
# gates below and stops there. `deploy.yml` refuses to leave on a commit whose run of this workflow
# is not green, so the conclusion of a master run is what production consumes; keeping it honest
# is the reason this file exists.
#
# Path filtering: the "changes" job (dorny/paths-filter) computes 4 outputs web/api/e2e/infra; each
# job only runs when its lane is affected (skipped otherwise). workflow_dispatch forces the 4 lanes,
# and **so does master**: a commit touching neither `apps/` nor `scripts/` skipped the 9 test jobs
# and concluded `success` in 12 s, yet `deploy.yml` reads only that conclusion. A red code commit
# followed by a documentation commit gave a green run, hence an authorised deployment of code that
# was never validated. The filter stays useful on PRs, where nothing deploys; on
# master, minutes are free since the repository went public, and the conclusion of a run must
# hold for the whole tree, not just the diff of the commit.
#   - Web lane: lint-web (`pnpm run check:static`), test-web-shard (three runners) then test-web
#     (merge + thresholds).
#   - API lane: lint-api, test-api (unit tests, then the integration suite on a real MongoDB).
#   - Infra lane: lint-terraform (fmt + validate on `infra/terraform/`).
#   - Cross-cutting: gitleaks (always), lint-workflows (always), npm/NuGet audit,
#     sonar (global analysis + blocking Quality Gate).
#   - E2E Playwright on a real MongoDB: blocking job + local run.
#   - Lighthouse is no longer here: it weighed 9 of the 27 minutes of a master run for a
#     measurement only a deployment consumed; it moved to `deploy.yml` without losing any of its
#     blocking power.
#
# The gates the workstation also runs are called through the same `pnpm run` entry points
# (`check:static`, `check:workflows`, `check:terraform`, `check:secrets`, `check:audit`,
# `test:api:mongo`), Docker being available on the runners: each tool is pinned once, in the
# script that runs it, and the CI cannot drift from what `verify:local` checks.
#
# Security hardening:
#   - Actions pinned by commit SHA (anti supply-chain); the # vX comment lets Dependabot propose updates.
#   - Docker images (gitleaks, actionlint, zizmor, Terraform, Trivy, MongoDB) pinned by sha256
#     digest in the gate scripts. The tools that no Dependabot ecosystem follows (those images,
#     SonarScanner) are listed by `scripts/check-tool-versions.mjs`, run during the weekly
#     maintenance pass.
#   - Least-privilege permissions (deny by default); checkout with persist-credentials: false.
#   - Secrets passed through env: (never interpolated directly into a run: block).
#   - Blocking SonarCloud Quality Gate: a red QG fails the job, hence forbids the deployment.
#   - concurrency: group ci-<ref>, cancel-in-progress on PRs / false on master.
#   - timeout-minutes on every job; NuGet / Turbo caches.

name: 🔍 CI

on:
  workflow_dispatch:
  # Master only: delivery is continuous, a feature lives on a short branch merged into master the
  # day it is ready, and no long-lived version branch exists any more. An ephemeral branch with an
  # open PR triggered two runs for the same commit (push + pull_request): it stays covered by
  # pull_request.
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  NODE_VERSION: "22"
  SONARSCANNER_VERSION: "11.3.0"

jobs:
  # Solo project: no external contribution is accepted, the licence forbids it and
  # `CONTRIBUTING.md` says so. A PR from a fork receives no secret, so its run would fail on
  # `sonar` for a reason that is not the proposed code, while spending the minutes quota.
  # `fork != true` covers the three triggers: on `push` and `workflow_dispatch` the `pull_request`
  # object is null, and null is not `true`.
  # The other jobs inherit the skip through their `needs: changes`.
  changes:
    name: 🧭 Change detection (path filtering)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.fork != true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
      api: ${{ steps.filter.outputs.api == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
      e2e: ${{ steps.filter.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
      infra: ${{ steps.filter.outputs.infra == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
    steps:
      # fetch-depth: 0 required: on push, paths-filter diffs against the previous commit through
      # git; without the full history it would have to fetch, which fails with
      # persist-credentials: false (no token). The full history avoids the fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/master'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/master'
        with:
          # `master` in both cases, and it is not an oversight: dorny/paths-filter special-cases
          # "base equals the pushed branch" and then compares against the previous commit. A
          # master push therefore diffs against its parent, a branch push against master. A
          # pseudo-ternary lived here, meant to pass an empty base on master, and it already
          # returned this same constant, but by accident: an empty string is falsy in a GitHub
          # Actions expression, so its "true" branch never won, for any ref. Writing the constant
          # removes the trap without changing anything in what is checked.
          base: master
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'eslint.config.mjs'
              - 'prettier.config.cjs'
              - 'knip.json'
              - 'configs/**'
              - 'scripts/**'
              - '.github/workflows/ci-cd.yml'
              - '.github/workflows/deploy.yml'
              - '.github/actions/**'
              - 'infra/terraform/**'
              - 'infra/firebase-hosting.json'
            e2e:
              - 'playwright.config.ts'
              - 'e2e/**'
            api:
              - 'apps/api-dotnet/**'
              - 'scripts/**'
              - '.github/workflows/ci-cd.yml'
              - '.github/actions/**'
            infra:
              - 'infra/terraform/**'
              - 'scripts/terraform.mjs'
              - 'scripts/check-terraform.mjs'
              - '.github/workflows/ci-cd.yml'
              - '.github/actions/setup-web/**'

  # The working tree as checked out, never the history (`scripts/check-secrets.mjs`). pnpm and Node
  # only, no `node_modules`: the scan reads the same tree as before the gate moved into the script.
  gitleaks:
    name: 🔑 Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.fork != true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
        with:
          install-dependencies: "false"
      - name: Scan working tree
        run: pnpm run check:secrets

  # Workflows are large YAML and bash files that neither check:architecture, nor ESLint, nor
  # Prettier look at: the chain guarding the code was itself guarded by nothing. The gate covers
  # the whole `.github/workflows/`, hence `deploy.yml` too, and it is unconditional like gitleaks:
  # a red master run forbids the deployment.
  #   - actionlint: syntax errors, invalid ${{ }} expressions, inconsistent permissions. It
  #     delegates `run:` blocks to the shellcheck its image ships. It only reads workflows, not
  #     composite actions.
  #   - zizmor: security audit of the workflows **and of the composite actions** in
  #     `.github/actions/`, where the web smoke tests, the health probes and the GCP authentication now
  #     live. `medium` threshold: the repository is at 0 medium and 0 high, so the gate is green
  #     today and only catches serious findings (injection from an untrusted context, exposed
  #     secrets). Going down to `low` would mean handling 9 cosmetic findings. `--offline` so that
  #     the gate does not depend on the GitHub API.
  # Both run from the images pinned by digest in `scripts/check-workflows.mjs`, the script
  # `verify:local` runs too: one version of each tool, whichever machine checks.
  lint-workflows:
    name: 🧹 Lint workflows (actionlint + zizmor)
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.fork != true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
        with:
          install-dependencies: "false"
      - name: actionlint (+ shellcheck on run blocks), then zizmor (medium threshold)
        run: pnpm run check:workflows

  # The infrastructure description (`infra/terraform/`, roadmap Terraform lots) is read by nothing
  # else in this workflow: without this job a malformed or invalid root module would only be
  # discovered at the next `plan`. `fmt -check` on the whole tree, then `init -backend=false` and
  # `validate` on every root module of `infra/terraform/environments/`, discovered by listing so
  # that a second environment cannot be forgotten. `-lockfile=readonly`: a provider bumped in
  # `versions.tf` without its checksums in `.terraform.lock.hcl` fails here rather than letting two
  # machines validate against two provider builds. No backend, no credentials: the job never
  # reaches GCP. `scripts/check-terraform.mjs`, the script of `verify:local`, through the image
  # pinned in `scripts/terraform.mjs`; the providers are downloaded once per run into a Docker
  # volume, no GHA cache.
  lint-terraform:
    name: 🧹 Lint Terraform (fmt + validate)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
        with:
          install-dependencies: "false"
      - name: terraform fmt, then init + validate on every root module
        run: pnpm run check:terraform

  # `check:static` is the one list of the static gates: architecture rules, script tests, `tsc`,
  # ESLint, Prettier, knip. The pre-push hook and `verify:local` run the same script.
  lint-web:
    name: 🧹 Static gates (architecture, tsc, eslint, prettier, knip)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-lintweb-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lintweb-${{ runner.os }}-
      - run: pnpm run check:static
        env:
          GH_TOKEN: ${{ github.token }}

  lint-api:
    name: 🧹 Lint API .NET (format + build + OpenAPI)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Restore API .NET
        run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      # Whitespace and charset, then the code style (the order of the usings lives there, not in
      # `whitespace`). The analyser pass of the full `dotnet format` is left out: it replays the
      # analysers the build below already runs with `-warnaserror`, for more than half the time.
      - name: dotnet format whitespace + style (verify)
        run: pnpm run format:dotnet:check
      - name: Build API .NET (warnings → errors)
        run: dotnet build apps/api-dotnet/MoviePicker.slnx -c Release --no-restore -warnaserror
      - name: Export OpenAPI (artifact)
        env:
          SKIP_OPENAPI_BUILD: '1'
        run: node scripts/export-openapi.cjs
      - name: Web types aligned with the OpenAPI contract
        run: node scripts/check-openapi-types.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi-v1
          path: artifacts/openapi-v1.json
          if-no-files-found: error
          retention-days: 7

  audit:
    name: 🛡️ Dependency audit (npm + NuGet)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same split as the image gate of `deploy.yml`, because `ignore-unfixed` applies to every
      # severity of a pass: a HIGH blocks once a fix is published, a CRITICAL blocks with or
      # without one. `scripts/check-audit.mjs`, the script of `verify:local`: Trivy from its image
      # pinned by digest, its database in a Docker volume, never in the GHA cache, which the jobs
      # running the code of the lockfile can write: a poisoned entry would blind this gate.
      - uses: ./.github/actions/setup-web
        if: needs.changes.outputs.web == 'true'
        with:
          install-dependencies: "false"
      - name: npm audit (Trivy on pnpm-lock.yaml, HIGH with a fix, then every CRITICAL)
        if: needs.changes.outputs.web == 'true'
        run: pnpm run check:audit
      - uses: ./.github/actions/setup-dotnet-cache
        if: needs.changes.outputs.api == 'true'
      - name: Restore API .NET (for the NuGet audit)
        if: needs.changes.outputs.api == 'true'
        run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      - name: "NuGet audit: list vulnerabilities (informational)"
        if: needs.changes.outputs.api == 'true'
        run: dotnet list apps/api-dotnet/MoviePicker.slnx package --vulnerable --include-transitive
      - name: "NuGet audit: fail on High / Critical"
        if: needs.changes.outputs.api == 'true'
        run: |
          set -o pipefail
          OUTPUT=$(dotnet list apps/api-dotnet/MoviePicker.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -Eq '\b(High|Critical)\b'; then
            echo "::error::High/Critical NuGet vulnerabilities detected. Update, or suppress through <NuGetAuditSuppress> in Directory.Build.props (document the reason)."
            exit 1
          fi

  # The web suite on three runners at once: on a single 4-vCPU runner it took 3 min 45, the whole
  # first half of the critical path (Sonar waits for its coverage). Each shard writes a blob report
  # holding its results and its coverage, with no threshold (`VITEST_COVERAGE_SHARD`, a third of
  # the files cannot reach them); `test-web` merges the three and applies the thresholds to the
  # whole, exactly what one run did.
  test-web-shard:
    name: 🧪 Web tests (shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - name: Vitest shard with coverage (blob report)
        env:
          VITEST_COVERAGE_SHARD: "1"
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter web exec vitest run --coverage --shard="$SHARD/3" --reporter=dot --reporter=blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-tests-blob-${{ matrix.shard }}
          path: apps/web/.vitest/blob
          if-no-files-found: error
          retention-days: 1

  test-web:
    name: 🧪 Web tests + coverage
    needs: [changes, test-web-shard]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      # One download per shard, by name: a single download by `pattern` with `merge-multiple` fetched
      # the three files in 6 seconds, then held the step for 3 minutes before handing over
      # (run 43901639979), where a download by name takes 1 to 2 seconds.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-tests-blob-1
          path: apps/web/.vitest/blob
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-tests-blob-2
          path: apps/web/.vitest/blob
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-tests-blob-3
          path: apps/web/.vitest/blob
      - name: Merge the shards, coverage thresholds on the whole suite
        run: pnpm --filter web exec vitest run --merge-reports .vitest/blob --coverage --reporter=dot
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: warn
          retention-days: 7

  # Unit tests, then the integration suite on a real MongoDB replica set: the API refuses to start
  # without MONGODB_URI, and the in-memory adapters live in MoviePicker.Api.TestSupport as test
  # doubles of the unit tests (audit B4, DEBT-096). Two reports, two gates:
  #   - the unit report (`coverlet.runsettings`, the Mongo adapters excluded since only a real
  #     database runs them) carries the API gate below, and is the one `sonar` regenerates;
  #   - `pnpm run test:api:mongo`, the workstation entry point, starts the container through
  #     `scripts/mongo-replica-set.mjs`, collects its own report
  #     (`coverlet.integration.runsettings`) and holds the `Infrastructure.Persistence.Mongo`
  #     namespace to its thresholds (`scripts/check-mongo-coverage.mjs`): without that gate the
  #     only layer that runs solely in production would be measured nowhere. It then plays the
  #     script tests that query MongoDB (`scripts/mongo-tests/`, the query of `pnpm run usage`) on
  #     the same container, since `test:scripts` runs without a database.
  test-api:
    name: 🧪 API .NET tests (unit, then integration on MongoDB) + coverage
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
        with:
          install-dependencies: "false"
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Unit tests + coverage
        run: |
          dotnet test apps/api-dotnet/MoviePicker.Api.Tests/MoviePicker.Api.Tests.csproj -c Debug \
            --collect:"XPlat Code Coverage" \
            --settings apps/api-dotnet/coverlet.runsettings \
            --results-directory ./coverage-unit
        env:
          MONGODB_URI: ""
      - name: API coverage gate (lines >= 90%, branches >= 78%)
        run: |
          set -eo pipefail
          report="$(find ./coverage-unit -name coverage.opencover.xml | head -1)"
          if [ -z "$report" ]; then
            echo "::error::OpenCover coverage report not found"
            exit 1
          fi
          fail=0
          seq="$(grep -m1 -o 'sequenceCoverage="[0-9.]*"' "$report" | grep -o '[0-9.]*')"
          branch="$(grep -m1 -o 'branchCoverage="[0-9.]*"' "$report" | grep -o '[0-9.]*')"
          echo "API line coverage:   ${seq}% (threshold 90%)"
          echo "API branch coverage: ${branch}% (threshold 78%)"
          if ! awk -v c="$seq" 'BEGIN { exit !(c + 0 >= 90) }'; then
            echo "::error::API line coverage ${seq}% < 90% required"
            fail=1
          fi
          if ! awk -v c="$branch" 'BEGIN { exit !(c + 0 >= 78) }'; then
            echo "::error::API branch coverage ${branch}% < 78% required"
            fail=1
          fi
          exit $fail
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-api-unit
          path: coverage-unit
          if-no-files-found: warn
          retention-days: 7
      - name: Integration tests on MongoDB + Mongo adapters coverage gate + script queries
        run: pnpm run test:api:mongo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: coverage-api-mongo
          path: coverage-mongo
          if-no-files-found: warn
          retention-days: 7

  # The whole Playwright suite on the full stack that runs in production: real browser, API wired
  # to a real MongoDB replica set started by the composite action (the code of
  # `scripts/mongo-replica-set.mjs`), dedicated database (the Development guard refuses the
  # `moviepicker` one). `pnpm run test:e2e:local` plays the same suite on the same engine.
  e2e:
    name: 🎭 E2E Playwright on MongoDB (blocking)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # Full history: `test:e2e:ci` builds the web app, whose tech metrics count the commits and
      # fail a CI build on a shallow clone (`apps/web/scripts/generate-tech-metrics.mjs`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-dotnet-cache
      - uses: ./.github/actions/start-mongo-replica-set
        with:
          container-name: mongo-e2e
          port: "27017"
      - name: Install the Playwright browsers (Chromium, and WebKit for the iPhone layouts)
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: E2E tests (web build + API on MongoDB + Playwright)
        run: pnpm run test:e2e:ci
        env:
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/moviepicker_e2e?directConnection=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-traces
          path: test-results
          # Playwright only writes test-results/ on failure/retry; empty on a green run is normal.
          if-no-files-found: ignore
          retention-days: 7

  # The job ran everywhere except on workflow_dispatch, because deployments lived here and an
  # excluded sonar was the only way to replay a deployment by hand. Deployments moved to
  # `deploy.yml`, and the exclusion became a hole: `deploy.yml` consumes the *conclusion* of a CI
  # run, yet a skipped job does not fail a run. A manual run without Quality Gate therefore
  # concluded green and authorised a deployment Sonar had never seen.
  # A manual run on another branch is analysed as a named Sonar branch (`sonar.branch.name`).
  # Without that parameter, an analysis pushed from a branch would overwrite master's, which
  # SonarCloud takes as the main branch by default.
  # It no longer waits for `test-api`: the job builds the solution anyway (the Roslyn analysers
  # run during that build), and the unit tests replayed on that build take seconds, where waiting
  # for `test-api` held the whole analysis behind its setup, its build and its integration tests.
  # `test-api` keeps its coverage gate; this job only needs the report.
  sonar:
    name: 📊 SonarCloud (analysis + coverage, blocking Quality Gate)
    needs: [changes, test-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      always() &&
      github.event.pull_request.head.repo.fork != true &&
      github.actor != 'dependabot[bot]' &&
      needs.changes.result == 'success' &&
      (needs.test-web.result == 'success' || needs.test-web.result == 'skipped')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: ./.github/actions/setup-dotnet-cache
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}
      - name: "Web coverage: download artifact (if test-web ran)"
        if: needs.test-web.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-web
          path: apps/web/coverage
      - name: "Web coverage: fallback (regenerate if test-web did not run)"
        if: needs.test-web.result != 'success'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:coverage --filter=web
      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner --version "$SONARSCANNER_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      # The `dotnet build` must stay between begin and end, that is where the Sonar Roslyn
      # analysers run. The unit tests only serve the coverage: they run on that very build, with
      # the settings of `test-api`, so the report is the one `test-api` gates.
      - name: SonarCloud analysis (begin + build + Quality Gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          MONGODB_URI: ""
        run: |
          set -eo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          . ./configs/sonar-exclusions.sh
          VERSION="$(git describe --tags --always 2>/dev/null || echo 0.0.0)"
          REFARGS=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            REFARGS=(/d:sonar.pullrequest.key="$PR_NUMBER" /d:sonar.pullrequest.branch="$PR_HEAD" /d:sonar.pullrequest.base="$PR_BASE")
          elif [ "$REF_NAME" != "master" ]; then
            REFARGS=(/d:sonar.branch.name="$REF_NAME")
          fi
          dotnet sonarscanner begin \
            /k:"Affy657_Movie-Picker" \
            /o:"affy657" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.scanner.skipJreProvisioning=true \
            /d:sonar.projectBaseDir="$GITHUB_WORKSPACE" \
            /d:sonar.architecture.enable=false \
            /v:"$VERSION" \
            /d:sonar.exclusions="$EXCL" \
            /d:sonar.test.exclusions="$TEST_EXCL" \
            /d:sonar.coverage.exclusions="$COV_EXCL" \
            /d:sonar.cpd.exclusions="$CPD" \
            /d:sonar.javascript.lcov.reportPaths="apps/web/coverage/lcov.info" \
            /d:sonar.cs.opencover.reportsPaths="coverage-unit/**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            "${REFARGS[@]}"
          dotnet build apps/api-dotnet/MoviePicker.slnx -c Debug
          dotnet test apps/api-dotnet/MoviePicker.Api.Tests/MoviePicker.Api.Tests.csproj -c Debug --no-build \
            --collect:"XPlat Code Coverage" \
            --settings apps/api-dotnet/coverlet.runsettings \
            --results-directory coverage-unit
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      # The Quality Gate only judges new code, and an issue accepted in the SonarCloud UI leaves
      # it: this step holds the whole branch to zero open, accepted or dismissed issues, zero
      # hotspot to review, A on every rating, no duplication and the coverage floor.
      - name: "SonarCloud: zero issues, A everywhere, no duplication, coverage floor"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_BRANCH: ${{ github.ref_name }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node scripts/check-sonar.mjs
      # SonarCloud files a pull request analysis under `pullRequest=<number>`, not under its head
      # branch: queried by branch, the diagnostic answered "No projectStatus" on every red PR.
      - name: "Quality Gate: failing conditions detail"
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eo pipefail
          cat > qg-report.mjs <<'NODESCRIPT'
          const token = process.env.SONAR_TOKEN ?? "";
          const branch = process.env.BRANCH_NAME ?? "";
          const prNumber = process.env.PR_NUMBER ?? "";
          const scope = prNumber
            ? "&pullRequest=" + encodeURIComponent(prNumber)
            : "&branch=" + encodeURIComponent(branch);
          const url =
            "https://sonarcloud.io/api/qualitygates/project_status" +
            "?projectKey=Affy657_Movie-Picker" + scope;

          const auth = {
            Authorization: "Basic " + Buffer.from(token + ":").toString("base64"),
          };
          const response = await fetch(url, { headers: auth });
          const body = await response.text();

          let parsed;
          try {
            parsed = JSON.parse(body);
          } catch {
            console.log("Unreadable SonarCloud response: " + body.slice(0, 500));
            process.exit(0);
          }

          const project = parsed.projectStatus;
          if (!project) {
            console.log("No projectStatus: " + JSON.stringify(parsed).slice(0, 500));
            process.exit(0);
          }

          console.log("Quality Gate: " + project.status);

          const failing = (project.conditions || []).filter((c) => c.status !== "OK");
          if (failing.length === 0) {
            console.log("No failing condition: the failure is probably technical.");
            process.exit(0);
          }

          for (const c of failing) {
            console.log(
              "::error::" + c.metricKey + " = " + c.actualValue +
                " (threshold " + c.comparator + " " + c.errorThreshold + ")"
            );
          }

          if (!failing.some((c) => c.metricKey.includes("duplicated"))) process.exit(0);

          const treeUrl =
            "https://sonarcloud.io/api/measures/component_tree" +
            "?component=Affy657_Movie-Picker" + scope +
            "&metricKeys=new_duplicated_lines,duplicated_lines,duplicated_lines_density" +
            "&qualifiers=FIL&s=metric&metricSort=duplicated_lines&asc=false&ps=20";
          const treeResponse = await fetch(treeUrl, { headers: auth });
          const treeBody = await treeResponse.text();

          let tree;
          try {
            tree = JSON.parse(treeBody);
          } catch {
            console.log("Unreadable component_tree: " + treeBody.slice(0, 800));
            process.exit(0);
          }

          const readMeasure = (component, key) => {
            const m = (component.measures || []).find((x) => x.metricKey === key);
            if (!m) return null;
            return m.value ?? m.period?.value ?? m.periods?.[0]?.value ?? null;
          };

          const rows = (tree.components || [])
            .map((component) => ({
              path: component.path,
              fresh: readMeasure(component, "new_duplicated_lines"),
              total: readMeasure(component, "duplicated_lines"),
              density: readMeasure(component, "duplicated_lines_density"),
            }))
            .filter((r) => r.fresh !== null || r.total !== null);

          if (rows.length === 0) {
            console.log("No per-file measure. Raw response:");
            console.log(treeBody.slice(0, 1500));
            process.exit(0);
          }

          console.log("Most duplicated files (new / total / density):");
          for (const r of rows) {
            console.log(
              "  " + (r.fresh ?? "-") + " / " + (r.total ?? "-") + " / " +
                (r.density ?? "-") + "%  " + r.path
            );
          }
          NODESCRIPT
          node qg-report.mjs
