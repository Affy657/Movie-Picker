# CI Movie Picker — monorepo (front Vite/React, API .NET). **Ce workflow ne déploie rien.**
#
# Le déploiement est un geste manuel, dans `.github/workflows/deploy.yml` : un push sur master
# joue les portes ci-dessous et s'arrête là. `deploy.yml` refuse de partir sur un commit dont le
# run de ce workflow n'est pas vert, donc la conclusion d'un run master est ce que consomme la
# production — la garder honnête est la raison d'être de ce fichier.
#
# Path-filtering : le job "changes" (dorny/paths-filter) calcule 3 sorties web/api/e2e ; chaque
# job ne tourne que si sa lane est impactée (skip sinon). workflow_dispatch force les 3 lanes.
#   - Lane web : lint-web, test-web.
#   - Lane api : lint-api, test-api, test-api-mongo.
#   - Transverses : gitleaks (toujours), lint-workflows (toujours), audit npm/NuGet,
#     sonar (analyse globale + Quality Gate bloquant).
#   - E2E Playwright : job bloquant + exécution locale.
#   - Lighthouse ne figure plus ici : il pesait 9 des 27 minutes d'un run master pour une mesure
#     que seul un déploiement consommait, il est passé dans `deploy.yml` sans rien perdre de son
#     pouvoir de blocage.
#
# Durcissement sécurité :
#   - Actions épinglées par SHA de commit (anti supply-chain) ; le commentaire # vX permet à Dependabot de proposer les MAJ.
#   - Images Docker (base .NET + gitleaks) épinglées par digest sha256.
#   - permissions least-privilege (deny par défaut) ; checkout avec persist-credentials: false.
#   - Secrets passés via env: (jamais interpolés directement dans un bloc run:).
#   - Quality Gate SonarCloud bloquant — un QG rouge fait échouer le job, donc interdit le déploiement.
#   - concurrency: group ci-<ref> — cancel-in-progress sur PR / false sur master.
#   - timeout-minutes sur chaque job ; caches NuGet / Turbo.

name: CI

on:
  workflow_dispatch:
  # Restreint aux branches durables : une branche éphémère avec une PR ouverte déclenchait
  # deux runs pour le même commit (push + pull_request). Elle reste couverte par pull_request.
  push:
    branches:
      - master
      - "v*"
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "10.0.x"
  ACTIONLINT_VERSION: "1.7.7"
  ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
  ZIZMOR_VERSION: "1.30.0"
  ZIZMOR_SHA256: "ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed"

jobs:
  changes:
    name: Détection des changements (path-filtering)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
      api: ${{ steps.filter.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
      e2e: ${{ steps.filter.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      # fetch-depth: 0 requis : sur push, paths-filter diffe contre le commit précédent
      # via git ; sans historique complet il devrait fetch, ce qui échoue avec
      # persist-credentials: false (pas de token). L'historique complet évite le fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.ref == 'refs/heads/master' && '' || 'master' }}
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'eslint.config.mjs'
              - 'prettier.config.cjs'
              - 'configs/**'
              - 'scripts/**'
              - '.github/workflows/ci-cd.yml'
              - '.github/actions/**'
            e2e:
              - 'playwright.config.ts'
              - 'e2e/**'
            api:
              - 'apps/api-dotnet/**'
              - 'scripts/**'
              - '.github/workflows/ci-cd.yml'
              - '.github/actions/**'

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan working tree
        run: |
          docker run --rm -v "${PWD}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            dir --no-banner --redact --verbose --exit-code 1 /repo

  # Les workflows sont de gros fichiers de YAML et de bash que ni check:architecture, ni ESLint,
  # ni Prettier ne regardent : la chaîne qui garde le code n'était elle-même gardée par rien. La
  # porte couvre `.github/workflows/` en entier, donc `deploy.yml` aussi, et elle est
  # inconditionnelle comme gitleaks : un run master rouge interdit le déploiement.
  #   - actionlint : erreurs de syntaxe, expressions ${{ }} invalides, permissions incohérentes.
  #     Il délègue aux blocs `run:` à shellcheck, préinstallé sur les runners GitHub.
  #   - zizmor : audit sécurité des workflows. Seuil `medium` — le dépôt est à 0 medium et 0 high,
  #     donc la porte est verte aujourd'hui et n'attrape que du sérieux (injection depuis un
  #     contexte non fiable, secrets exposés). Descendre à `low` demanderait de traiter 9 constats
  #     cosmétiques. `--offline` pour que la porte ne dépende pas de l'API GitHub.
  lint-workflows:
    name: Lint workflows (actionlint + zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (+ shellcheck sur les blocs run)
        run: |
          set -eo pipefail
          curl -sSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor (audit sécurité, seuil medium)
        run: |
          set -eo pipefail
          curl -sSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/zizmor.tgz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/zizmor.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/zizmor.tgz" -C "$RUNNER_TEMP" zizmor
          "$RUNNER_TEMP/zizmor" --offline --no-progress --min-severity medium --format plain .github/workflows/

  lint-web:
    name: Lint front (tsc + eslint + prettier)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-lintweb-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-lintweb-${{ runner.os }}-
      - run: pnpm run check:architecture
      - run: pnpm run lint
      - run: pnpm run lint:eslint
      - run: pnpm run format:check

  lint-api:
    name: Lint API .NET (format + build + OpenAPI)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Restore API .NET
        run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      - name: dotnet format (vérification, roadmap § 31)
        run: dotnet format apps/api-dotnet/MoviePicker.slnx --verify-no-changes --verbosity minimal
      - name: Build API .NET (warnings → errors)
        run: dotnet build apps/api-dotnet/MoviePicker.slnx -c Release --no-restore -warnaserror
      - name: Export OpenAPI (artefact, roadmap § 32)
        env:
          SKIP_OPENAPI_BUILD: '1'
        run: node scripts/export-openapi.cjs
      - name: Types front alignés sur le contrat OpenAPI
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/check-openapi-types.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-v1
          path: artifacts/openapi-v1.json
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Audit dépendances (npm + NuGet)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit npm (Trivy — pnpm audit indisponible, endpoint npm retiré le 2026-07-15, cf. pnpm/pnpm#11265)
        if: needs.changes.outputs.web == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: needs.changes.outputs.api == 'true'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.api == 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api-dotnet/**/*.csproj', 'apps/api-dotnet/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore API .NET (pour audit NuGet)
        if: needs.changes.outputs.api == 'true'
        run: dotnet restore apps/api-dotnet/MoviePicker.slnx
      - name: Audit NuGet — liste vulnérabilités (informatif)
        if: needs.changes.outputs.api == 'true'
        run: dotnet list apps/api-dotnet/MoviePicker.slnx package --vulnerable --include-transitive
      - name: Audit NuGet — échoue si High / Critical
        if: needs.changes.outputs.api == 'true'
        run: |
          set -o pipefail
          OUTPUT=$(dotnet list apps/api-dotnet/MoviePicker.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -Eq '\b(High|Critical)\b'; then
            echo "::error::Vulnérabilités NuGet High/Critical détectées. Mettre à jour ou suppress via <NuGetAuditSuppress> dans Directory.Build.props (documenter la raison)."
            exit 1
          fi

  test-web:
    name: Tests front + couverture
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-testweb-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-testweb-${{ runner.os }}-
      - run: pnpm run test:coverage --filter=web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: warn
          retention-days: 7

  test-api:
    name: Tests API .NET + couverture
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Tests unitaires + couverture
        run: |
          dotnet test apps/api-dotnet/MoviePicker.Api.Tests/MoviePicker.Api.Tests.csproj -c Debug \
            --collect:"XPlat Code Coverage" \
            --settings apps/api-dotnet/coverlet.runsettings \
            --results-directory ./coverage-unit
        env:
          MONGODB_URI: ""
      - name: Gate couverture back (lignes >= 90%, branches >= 78%)
        run: |
          set -eo pipefail
          report="$(find ./coverage-unit -name coverage.opencover.xml | head -1)"
          if [ -z "$report" ]; then
            echo "::error::Rapport de couverture OpenCover introuvable"
            exit 1
          fi
          fail=0
          seq="$(grep -m1 -o 'sequenceCoverage="[0-9.]*"' "$report" | grep -o '[0-9.]*')"
          branch="$(grep -m1 -o 'branchCoverage="[0-9.]*"' "$report" | grep -o '[0-9.]*')"
          echo "Couverture lignes back   : ${seq}% (seuil 90%)"
          echo "Couverture branches back : ${branch}% (seuil 78%)"
          if ! awk -v c="$seq" 'BEGIN { exit !(c + 0 >= 90) }'; then
            echo "::error::Couverture lignes back ${seq}% < 90% requis"
            fail=1
          fi
          if ! awk -v c="$branch" 'BEGIN { exit !(c + 0 >= 78) }'; then
            echo "::error::Couverture branches back ${branch}% < 78% requis"
            fail=1
          fi
          exit $fail
      - name: Tests intégration
        run: dotnet test apps/api-dotnet/MoviePicker.Api.IntegrationTests/MoviePicker.Api.IntegrationTests.csproj -c Debug --verbosity normal
        env:
          MONGODB_URI: ""
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-api-unit
          path: coverage-unit
          if-no-files-found: warn
          retention-days: 7

  test-api-mongo:
    name: Tests API .NET sur MongoDB réel
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Démarrer MongoDB en replica set (transactions)
        run: |
          set -eo pipefail
          docker run -d --name mongo-it -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            if docker exec mongo-it mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-it mongosh --quiet --eval             'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for _ in $(seq 1 30); do
            if [ "$(docker exec mongo-it mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; then
              break
            fi
            sleep 2
          done
      - name: Tests intégration sur MongoDB + couverture
        run: |
          set -eo pipefail
          dotnet test apps/api-dotnet/MoviePicker.Api.IntegrationTests/MoviePicker.Api.IntegrationTests.csproj \
            -c Debug --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --settings apps/api-dotnet/coverlet.integration.runsettings \
            --results-directory ./coverage-mongo
        env:
          MONGODB_URI: ""
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
      # Les adaptateurs Mongo sont exclus du rapport du job test-api : ils ne tournent que sur une
      # vraie base. Sans cette porte, la seule couche qui ne s'exécute qu'en production n'est
      # mesurée nulle part.
      - name: Gate couverture des adaptateurs Mongo
        run: node scripts/check-mongo-coverage.mjs coverage-mongo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-api-mongo
          path: coverage-mongo
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: E2E Playwright (bloquant)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Installer le navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests E2E (build front + API stub + Playwright)
        run: pnpm run test:e2e:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-traces
          path: test-results
          # Playwright n'écrit test-results/ qu'en cas d'échec/retry ; vide sur run vert = normal.
          if-no-files-found: ignore
          retention-days: 7

  e2e-mongo:
    # Seul job qui joue la pile complète : navigateur réel + API branchée sur un vrai MongoDB.
    # Le job e2e tourne sur la base mémoire, test-api-mongo tourne sans navigateur : sans celui-ci,
    # la combinaison qui tourne en production n'est reproduite nulle part avant le déploiement.
    name: E2E parcours critique sur MongoDB réel (bloquant)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/setup-dotnet-cache
      - name: Démarrer MongoDB en replica set (transactions)
        run: |
          set -eo pipefail
          docker run -d --name mongo-e2e -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            if docker exec mongo-e2e mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-e2e mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'
          for _ in $(seq 1 30); do
            if [ "$(docker exec mongo-e2e mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; then
              break
            fi
            sleep 2
          done
      - name: Installer le navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Parcours critique (front buildé + API sur MongoDB + Playwright)
        run: pnpm run test:e2e:mongo
        env:
          # Base dédiée : le garde-fou Development refuse la base 'moviepicker'.
          E2E_MONGODB_URI: mongodb://127.0.0.1:27017/moviepicker_e2e?directConnection=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-traces-mongo
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # Le job tournait partout sauf sur workflow_dispatch, parce que les déploiements vivaient ici et
  # qu'un sonar exclu était le seul moyen de rejouer un déploiement à la main. Les déploiements
  # sont partis dans `deploy.yml`, et l'exclusion est devenue un trou : `deploy.yml` consomme la
  # *conclusion* d'un run CI, or un job sauté ne fait pas échouer un run. Un run manuel sans
  # Quality Gate concluait donc au vert et autorisait un déploiement que Sonar n'avait pas vu.
  sonar:
    name: SonarCloud (analyse + couverture ; QG bloquant)
    needs: [changes, test-web, test-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      always() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') &&
      (needs.test-web.result == 'success' || needs.test-api.result == 'success')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api-dotnet/**/*.csproj', 'apps/api-dotnet/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Couverture front — download artefact (si test-web a tourné)
        if: needs.test-web.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-web
          path: apps/web/coverage
      - name: Couverture front — fallback (régénère si test-web non exécuté)
        if: needs.test-web.result != 'success'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run test:coverage --filter=web
      - name: Installer SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 11.2.1
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Analyse SonarCloud (begin + build + tests + Quality Gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          MONGODB_URI: ""
        run: |
          set -eo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN manquant (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          . ./configs/sonar-exclusions.sh
          VERSION="$(git describe --tags --always 2>/dev/null || echo 0.0.0)"
          PRARGS=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PRARGS=(/d:sonar.pullrequest.key="$PR_NUMBER" /d:sonar.pullrequest.branch="$PR_HEAD" /d:sonar.pullrequest.base="$PR_BASE")
          fi
          dotnet sonarscanner begin \
            /k:"Affy657_Movie-Picker" \
            /o:"affy657" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.scanner.skipJreProvisioning=true \
            /d:sonar.projectBaseDir="$GITHUB_WORKSPACE" \
            /d:sonar.architecture.enable=false \
            /v:"$VERSION" \
            /d:sonar.exclusions="$EXCL" \
            /d:sonar.coverage.exclusions="$COV_EXCL" \
            /d:sonar.cpd.exclusions="$CPD" \
            /d:sonar.javascript.lcov.reportPaths="apps/web/coverage/lcov.info" \
            /d:sonar.cs.opencover.reportsPaths="apps/api-dotnet/**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            "${PRARGS[@]}"
          dotnet build apps/api-dotnet/MoviePicker.slnx -c Debug
          dotnet test apps/api-dotnet/MoviePicker.Api.Tests/MoviePicker.Api.Tests.csproj -c Debug --no-build \
            --collect:"XPlat Code Coverage" \
            --settings apps/api-dotnet/coverlet.runsettings \
            --results-directory apps/api-dotnet/MoviePicker.Api.Tests/TestResults
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      - name: "Quality Gate — detail des conditions en echec"
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eo pipefail
          cat > qg-report.mjs <<'NODESCRIPT'
          const token = process.env.SONAR_TOKEN ?? "";
          const branch = process.env.BRANCH_NAME ?? "";
          const url =
            "https://sonarcloud.io/api/qualitygates/project_status" +
            "?projectKey=Affy657_Movie-Picker&branch=" + encodeURIComponent(branch);

          const auth = {
            Authorization: "Basic " + Buffer.from(token + ":").toString("base64"),
          };
          const response = await fetch(url, { headers: auth });
          const body = await response.text();

          let parsed;
          try {
            parsed = JSON.parse(body);
          } catch {
            console.log("Reponse SonarCloud illisible : " + body.slice(0, 500));
            process.exit(0);
          }

          const project = parsed.projectStatus;
          if (!project) {
            console.log("Pas de projectStatus : " + JSON.stringify(parsed).slice(0, 500));
            process.exit(0);
          }

          console.log("Quality Gate : " + project.status);

          const failing = (project.conditions || []).filter((c) => c.status !== "OK");
          if (failing.length === 0) {
            console.log("Aucune condition en echec : echec probablement technique.");
            process.exit(0);
          }

          for (const c of failing) {
            console.log(
              "::error::" + c.metricKey + " = " + c.actualValue +
                " (seuil " + c.comparator + " " + c.errorThreshold + ")"
            );
          }

          if (!failing.some((c) => c.metricKey.includes("duplicated"))) process.exit(0);

          const treeUrl =
            "https://sonarcloud.io/api/measures/component_tree" +
            "?component=Affy657_Movie-Picker&branch=" + encodeURIComponent(branch) +
            "&metricKeys=new_duplicated_lines,duplicated_lines,duplicated_lines_density" +
            "&qualifiers=FIL&s=metric&metricSort=duplicated_lines&asc=false&ps=20";
          const treeResponse = await fetch(treeUrl, { headers: auth });
          const treeBody = await treeResponse.text();

          let tree;
          try {
            tree = JSON.parse(treeBody);
          } catch {
            console.log("component_tree illisible : " + treeBody.slice(0, 800));
            process.exit(0);
          }

          const readMeasure = (component, key) => {
            const m = (component.measures || []).find((x) => x.metricKey === key);
            if (!m) return null;
            return m.value ?? m.period?.value ?? m.periods?.[0]?.value ?? null;
          };

          const rows = (tree.components || [])
            .map((component) => ({
              path: component.path,
              neuf: readMeasure(component, "new_duplicated_lines"),
              total: readMeasure(component, "duplicated_lines"),
              densite: readMeasure(component, "duplicated_lines_density"),
            }))
            .filter((r) => r.neuf !== null || r.total !== null);

          if (rows.length === 0) {
            console.log("Aucune mesure par fichier. Reponse brute :");
            console.log(treeBody.slice(0, 1500));
            process.exit(0);
          }

          console.log("Fichiers les plus dupliques (neuf / total / densite) :");
          for (const r of rows) {
            console.log(
              "  " + (r.neuf ?? "-") + " / " + (r.total ?? "-") + " / " +
                (r.densite ?? "-") + "%  " + r.path
            );
          }
          NODESCRIPT
          node qg-report.mjs
