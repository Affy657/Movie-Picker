name: 💡 Demande de fonctionnalité
description: Proposer une évolution ou une nouvelle fonctionnalité.
title: "[Feat] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: besoin
    attributes:
      label: Besoin utilisateur
      description: Quel problème cette fonctionnalité résout-elle ? Pour qui ?
      placeholder: "En tant que <persona>, je veux <action> afin de <bénéfice>."
    validations:
      required: true
  - type: textarea
    id: valeur
    attributes:
      label: Valeur attendue
      description: Gain pour l'utilisateur / le produit (rétention, conversion, confort…).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
    validations:
      required: false
