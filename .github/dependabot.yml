# Mises à jour de dépendances (roadmap § 26)
# Politique « peu de PRs » : calendrier mensuel + une PR groupée par écosystème
# (évite la pluie de PR au premier run ou chaque semaine).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Monorepo pnpm (racine + workspace apps/*) → un seul bump npm par cycle
      npm-all:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /apps/api-dotnet
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      nuget-all:
        patterns:
          - "*"
