# Mises à jour de dépendances (roadmap § 26)
# Politique « peu de PRs » : calendrier mensuel + une PR groupée par écosystème
# (évite la pluie de PR au premier run ou chaque semaine).
# `cooldown` : une version publiée depuis moins de 7 jours n'est pas proposée. Un paquet compromis
# en amont est le plus souvent retiré dans ce délai, la fenêtre d'exposition se ferme avant que la
# PR n'existe. zizmor, qui lit ce fichier depuis que la porte `lint-workflows` couvre `.github/`
# en entier, l'exige au seuil medium.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # Monorepo pnpm (racine + workspace apps/*) → un seul bump npm par cycle
      npm-all:
        patterns:
          - "*"

  # `directory: /` ne couvre que `.github/workflows/` : les actions composites de
  # `.github/actions/` ont dérivé pendant des mois (setup-dotnet v5 et cache v5 d'un côté,
  # v6 de l'autre) sans qu'aucune PR ne les propose. Chaque dossier d'action doit être listé.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /apps/api-dotnet
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      nuget-all:
        patterns:
          - "*"

  # Images de base du Dockerfile API (FROM ... épinglés par digest) → bump digest auto
  - package-ecosystem: docker
    directory: /apps/api-dotnet/MoviePicker.Api
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      docker-all:
        patterns:
          - "*"

  # Slides Slidev archivées (archive/, non maintenues) : neutralise Dependabot
  # version sur ce manifeste figé. Le package-lock.json local n'est pas versionné
  # (cf. archive/.../slides/.gitignore) pour éviter les security updates GitHub
  # qui échouent avec all_versions_ignored alors que le lockfile reste vulnérable.
  - package-ecosystem: npm
    directory: /archive/docs/RNCP/bloc-1-cadrage/slides
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
