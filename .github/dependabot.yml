# Dependency updates (roadmap § 26)
# "Few PRs" policy: monthly schedule + one grouped PR per ecosystem
# (avoids the PR flood on the first run or every week).
# `cooldown`: a version published less than 7 days ago is not proposed. A package compromised
# upstream is most often pulled within that window, so the exposure closes before the PR exists.
# zizmor, which reads this file since the `lint-workflows` gate covers the whole `.github/`,
# requires it at the medium threshold.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # pnpm monorepo (root + apps/* workspace) → a single npm bump per cycle
      npm-all:
        patterns:
          - "*"

  # `directory: /` only covers `.github/workflows/`: the composite actions in `.github/actions/`
  # drifted for months (setup-dotnet v5 and cache v5 on one side, v6 on the other) without any
  # PR proposing them. Every action folder must be listed.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /apps/api-dotnet
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      nuget-all:
        patterns:
          - "*"

  # Base images of the API Dockerfile (FROM ... pinned by digest) → automatic digest bump
  - package-ecosystem: docker
    directory: /apps/api-dotnet/MoviePicker.Api
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      docker-all:
        patterns:
          - "*"

  # Terraform providers of every root module (`required_providers` in versions.tf). Dependabot
  # does not follow the Terraform binary itself: `scripts/check-tool-versions.mjs` does. After a
  # provider bump, `.terraform.lock.hcl` must carry the new checksums for the five platforms of
  # `scripts/terraform.mjs` (`pnpm run terraform -- providers lock`), or `lint-terraform` refuses
  # the pull request.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/environments/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      terraform-all:
        patterns:
          - "*"
