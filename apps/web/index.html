    <script>
      (function () {
        try {
          var p =
            localStorage.getItem('moviepicker-ui-preference') ||
            localStorage.getItem('moviepicker-theme');
          var dark =
            p === 'dark' ||
            (p !== 'light' && globalThis.matchMedia('(prefers-color-scheme:dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', dark ? '#0a0f1c' : '#f4f6fa');
        } catch {
          /* préférence de thème indisponible : on garde le thème par défaut */
        }
      })();
    </script>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('moviepicker-locale');
        } catch {}
        document.documentElement.lang = stored === 'en' ? 'en' : 'fr';
        if (location.pathname === '/') document.documentElement.dataset.startRoute = 'home';
      })();
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #f4f6fa;
      }
      [data-theme='dark'] #splash {
        background: #0f172a;
      }
      .splash-mark {
        width: 72px;
        height: 72px;
        overflow: visible;
      }
      .splash-clap {
        fill: #1d4ed8;
      }
      .splash-ink {
        fill: #ffffff;
      }
      .splash-bar {
        transform-origin: 8px 25px;
        animation: splash-bar 1.8s infinite;
      }
      .splash-body {
        transform-origin: 32px 53px;
        animation: splash-body 1.8s infinite;
      }
      .splash-spark {
        fill: none;
        stroke: #22d3ee;
        stroke-width: 2.2;
        stroke-linecap: round;
        opacity: 0;
        transform-origin: 60px 20.75px;
        animation: splash-spark 1.8s infinite;
      }
      @keyframes splash-bar {
        0% {
          transform: rotate(-11deg);
          animation-timing-function: cubic-bezier(0.3, 0, 0.3, 1);
        }
        28% {
          transform: rotate(-23deg);
          animation-timing-function: cubic-bezier(0.6, 0, 1, 1);
        }
        40% {
          transform: rotate(0deg);
          animation-timing-function: ease-out;
        }
        46% {
          transform: rotate(-4deg);
          animation-timing-function: ease-in;
        }
        52%,
        76% {
          transform: rotate(0deg);
          animation-timing-function: cubic-bezier(0.3, 0, 0.3, 1);
        }
        100% {
          transform: rotate(-11deg);
        }
      }
      @keyframes splash-body {
        0%,
        39% {
          transform: scaleY(1);
        }
        43% {
          transform: scaleY(0.95);
        }
        50%,
        100% {
          transform: scaleY(1);
        }
      }
      @keyframes splash-spark {
        0%,
        39% {
          opacity: 0;
          transform: scale(0.6);
        }
        42% {
          opacity: 1;
          transform: scale(1);
        }
        60%,
        100% {
          opacity: 0;
          transform: scale(1.3);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark * {
          animation-play-state: paused;
          animation-delay: 0s;
        }
      }
      #splash-brand svg {
        display: block;
        width: auto;
        height: 1.5rem;
      }
      .splash-word {
        fill: #0f172a;
      }
      .splash-picker {
        fill: #2563eb;
      }
      .splash-dot {
        fill: #22d3ee;
      }
      [data-theme='dark'] .splash-clap {
        fill: #3b82f6;
      }
      [data-theme='dark'] .splash-word {
        fill: #f8fafc;
      }
      [data-theme='dark'] .splash-picker {
        fill: #60a5fa;
      }
      #splash-title {
        max-width: 36rem;
        margin: 0;
        padding-inline: 1rem;
        font-family:
          'Overpass',
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 32px;
        font-weight: 700;
        line-height: 1.6;
        text-align: center;
        text-wrap: balance;
        color: #0f172a;
      }
      #splash-title:empty {
        display: none;
      }
      [data-theme='dark'] #splash-title {
        color: #f8fafc;
      }
    </style>

    <script>
      (function () {
        if (document.documentElement.dataset.startRoute !== 'home') return;
        document.getElementById('splash-brand').hidden = true;
        document.getElementById('splash-title').textContent =
          document.documentElement.lang === 'en'
            ? 'What are we watching tonight?'
            : "Qu'est-ce qu'on regarde ce soir ?";
      })();
    </script>
    <div id="root"></div>
    <script>
      (function () {
        function showEntryFailure(event) {
          var source = event.target;
          if (!source || source.tagName !== 'SCRIPT' || source.type !== 'module') return;
          var splash = document.getElementById('splash');
          var root = document.getElementById('root');
          if (!splash || !root || root.firstChild) return;
          var english = document.documentElement.lang === 'en';
          var message = document.createElement('p');
          message.textContent = english
            ? 'Movie Picker could not start. Reload the page to try again.'
            : 'Movie Picker n’a pas pu démarrer. Rechargez la page pour réessayer.';
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = english ? 'Reload the page' : 'Recharger la page';
          button.addEventListener('click', function () {
            location.reload();
          });
          var panel = document.createElement('div');
          panel.className = 'boot-failure';
          panel.setAttribute('role', 'alert');
          panel.append(message, button);
          root.append(panel);
          splash.remove();
        }
        addEventListener('error', showEntryFailure, true);
      })();
    </script>
