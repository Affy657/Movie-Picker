<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta id="theme-color-meta" name="theme-color" content="#f4f6fa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Movie Picker" />
    <meta
      name="description"
      content="Movie Picker — organisez une soirée cinéma : créez un événement, partagez le lien, proposez des films (TMDB), votez et tirez au sort le film gagnant."
    />
    <meta property="og:site_name" content="Movie Picker" />
    <meta property="og:title" content="Movie Picker" />
    <meta
      property="og:description"
      content="Créez une soirée film, invitez vos amis, votez et lancez la roue pour choisir le film."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://web.movie-picker.fr/" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://web.movie-picker.fr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Movie Picker — choisissez le film de la soirée ensemble"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Movie Picker" />
    <meta
      name="twitter:description"
      content="Créez une soirée film, invitez vos amis, votez et lancez la roue pour choisir le film."
    />
    <meta name="twitter:image" content="https://web.movie-picker.fr/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Movie Picker — choisissez le film de la soirée ensemble"
    />
    <link rel="canonical" href="https://web.movie-picker.fr/" />
    <title>Movie Picker</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://web.movie-picker.fr/#website",
            "url": "https://web.movie-picker.fr/",
            "name": "Movie Picker",
            "inLanguage": "fr-FR",
            "description": "Organisez une soirée cinéma : créez un événement, partagez le lien, proposez des films, votez et tirez au sort le film gagnant."
          },
          {
            "@type": "SoftwareApplication",
            "name": "Movie Picker",
            "applicationCategory": "EntertainmentApplication",
            "operatingSystem": "Web",
            "url": "https://web.movie-picker.fr/",
            "inLanguage": "fr-FR",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
            "description": "Application web pour organiser une soirée cinéma entre amis : propositions de films via TMDB, votes et tirage au sort du film gagnant."
          }
        ]
      }
    </script>
    <script>
      (function () {
        try {
          var p =
            localStorage.getItem('moviepicker-ui-preference') ||
            localStorage.getItem('moviepicker-theme');
          var dark =
            p === 'dark' ||
            (p !== 'light' && globalThis.matchMedia('(prefers-color-scheme:dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', dark ? '#0a0f1c' : '#f4f6fa');
        } catch {
          /* préférence de thème indisponible : on garde le thème par défaut */
        }
      })();
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #f4f6fa;
      }
      [data-theme='dark'] #splash {
        background: #0f172a;
      }
      #splash img {
        width: 72px;
        height: 72px;
      }
      #splash span {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0f172a;
      }
      [data-theme='dark'] #splash span {
        color: #f8fafc;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo.svg" alt="" width="72" height="72" />
      <span>Movie Picker</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
