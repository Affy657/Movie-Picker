sonar.projectKey=Affy657_Movie-Picker
sonar.organization=affy657

# Exclure les fichiers de build et dépendances
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/build/**,**/.next/**

# Rapport de couverture Jest/Vitest
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

# Exclure les fichiers naturellement répétitifs de la détection de duplication
# (tests avec setup identique, fichiers de locale en N langues, handlers de mock, seeds de données)
sonar.cpd.exclusions=\
  apps/web/src/**/*.test.ts,\
  apps/web/src/**/*.test.tsx,\
  apps/web/src/**/locales/fr.ts,\
  apps/web/src/**/locales/en.ts,\
  apps/web/src/mocks/**,\
  apps/api-dotnet/**/*Tests.cs,\
  apps/api-dotnet/**/*Tests/**,\
  apps/api-dotnet/**/Development/**
