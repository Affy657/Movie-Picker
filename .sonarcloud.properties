sonar.projectKey=Affy657_Movie-Picker
sonar.organization=affy657

# Exclure build, dépendances, archives, docs, e2e, scripts, outils et tests de l'analyse
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/build/**,**/.next/**,archive/**,docs/**,e2e/**,scripts/**,configs/**,logs/**,test-results/**,artifacts/**,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx,apps/web/src/mocks/**,apps/api-dotnet/*.Tests/**,apps/api-dotnet/*.IntegrationTests/**,apps/api-dotnet/ToolGenDpKey/**

# Rapport de couverture Jest/Vitest
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

# Exclure les fichiers naturellement répétitifs de la détection de duplication
# (fichiers de locale en N langues, seeds de données de dev)
sonar.cpd.exclusions=apps/web/src/**/locales/fr.ts,apps/web/src/**/locales/en.ts,apps/api-dotnet/**/Development/**
